  <!-- Manejo global de errores para GitHub Pages: Captura excepciones y previene pantalla blanca -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('Global Error caught:', e);
      var appEl = document.getElementById('app');
      var existingErr = document.getElementById('global-error-screen');
      if (!existingErr && (!appEl || !appEl.children.length || appEl.innerHTML.trim() === '')) {
        var errBox = document.createElement('div');
        errBox.id = 'global-error-screen';
        errBox.style.cssText = 'position:fixed;inset:0;background:#000533;color:#ff6b6b;padding:24px;font-family:system-ui,sans-serif;z-index:99999;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;';
        errBox.innerHTML = '<div style="max-width:580px;background:#000842;border:2px solid #f59e0b;padding:24px;border-radius:20px;color:#fff;box-shadow:0 0 40px rgba(245,158,11,0.2);">' +
          '<div style="width:48px;height:48px;margin:0 auto 12px;background:rgba(245,158,11,0.15);border:2px solid #f59e0b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;">⚠️</div>' +
          '<h2 style="color:#FFCC00;font-size:20px;font-weight:900;margin-bottom:8px;text-transform:uppercase;">Diagnóstico de Ejecución</h2>' +
          '<p style="color:#94a3b8;font-size:13px;margin-bottom:14px;line-height:1.5;">Se detectó una interrupción durante la inicialización en este navegador:</p>' +
          '<pre style="background:#00021a;padding:12px;border-radius:10px;border:1px solid #1e293b;color:#fca5a5;font-size:12px;text-align:left;overflow-x:auto;white-space:pre-wrap;font-family:monospace;">' + (e.message || e.error || 'Error no especificado') + (e.filename ? '\nEn: ' + e.filename + ':' + e.lineno : '') + '</pre>' +
          '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">' +
            '<button onclick="localStorage.clear();sessionStorage.clear();location.reload();" style="padding:10px 18px;background:#FFCC00;color:#000533;border:none;border-radius:10px;font-weight:900;font-size:12px;text-transform:uppercase;cursor:pointer;">Limpiar Memoria y Reiniciar</button>' +
            '<button onclick="location.reload();" style="padding:10px 18px;background:#1e293b;color:#e2e8f0;border:1px solid #475569;border-radius:10px;font-weight:bold;font-size:12px;text-transform:uppercase;cursor:pointer;">Reintentar</button>' +
          '</div>' +
        '</div>';
        document.body.appendChild(errBox);
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.warn('Unhandled Promise Rejection:', e.reason);
    });
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    /* Permitir selección y edición fluida en campos de texto en dispositivos móviles */
    input, textarea, select {
      user-select: auto !important;
      -webkit-user-select: auto !important;
    }
    input[type="text"], input[type="password"], input[type="number"], select {
      font-size: 16px; /* Evita que Safari en iOS haga zoom forzado o desenfoque al abrir el teclado */
    }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-bebas { font-family: 'Bebas Neue', cursive; }
    .font-teko { font-family: 'Teko', sans-serif; }
    
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-fast { animation: pulse-fast 1s infinite ease-in-out; }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake { animation: shake 0.35s ease-in-out; }

    /* Animación dramática de apertura de pregunta (zoom & scale-up) */
    @keyframes clue-zoom-in {
      0% {
        opacity: 0;
        transform: scale(0.68) translateY(24px);
      }
      70% {
        transform: scale(1.02) translateY(-2px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .animate-clue-zoom {
      animation: clue-zoom-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Brillo Neón Dorado de estudio televisivo */
    @keyframes neon-gold-glow {
      0%, 100% {
        box-shadow: 0 0 35px rgba(255, 204, 0, 0.5), 0 0 70px rgba(212, 175, 55, 0.3), inset 0 0 20px rgba(255, 204, 0, 0.2);
      }
      50% {
        box-shadow: 0 0 55px rgba(255, 204, 0, 0.8), 0 0 100px rgba(212, 175, 55, 0.5), inset 0 0 32px rgba(255, 204, 0, 0.3);
      }
    }
    .neon-gold-border {
      border: 4px solid #FFCC00;
      animation: neon-gold-glow 2.5s infinite alternate ease-in-out;
    }

    /* Texto con resplandor neón dorado */
    .neon-gold-text {
      text-shadow: 0 0 10px rgba(255, 204, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.6), 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    /* Reflejo dinámico de luz dorada que recorre el tablero */
    @keyframes gold-shine-sweep {
      0% { transform: translateX(-120%) rotate(25deg); }
      20%, 100% { transform: translateX(250%) rotate(25deg); }
    }
    .gold-sheen-effect {
      position: relative;
      overflow: hidden;
    }
    .gold-sheen-effect::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 204, 0, 0.03) 40%,
        rgba(255, 255, 255, 0.28) 50%,
        rgba(255, 204, 0, 0.03) 60%,
        transparent 100%
      );
      transform: translateX(-120%) rotate(25deg);
      animation: gold-shine-sweep 6s infinite ease-in-out;
      pointer-events: none;
    }

    /* Marco metálico de estudio de televisión para el tablero */
    .tv-studio-frame {
      background: linear-gradient(165deg, #2b354d 0%, #131b2e 30%, #080d1a 70%, #030612 100%);
      border: 4px solid #475569;
      box-shadow: 
        0 0 0 2px #d4af37,
        0 0 0 5px #1e293b,
        0 25px 60px rgba(0, 0, 0, 0.9),
        0 0 50px rgba(6, 12, 233, 0.3),
        inset 0 2px 4px rgba(255, 255, 255, 0.25),
        inset 0 -2px 8px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* Remache / tornillo metálico decorativo de escenario TV */
    .metal-rivet {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e2e8f0 0%, #64748b 60%, #1e293b 100%);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.6);
      border: 1px solid #334155;
    }

    /* Halo pulsante para el pulsador móvil cuando está listo */
    @keyframes buzzer-ready-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.75), 0 16px 0 #7f1d1d, 0 25px 45px rgba(225, 29, 72, 0.7);
      }
      70% {
        box-shadow: 0 0 0 24px rgba(239, 68, 68, 0), 0 16px 0 #7f1d1d, 0 30px 60px rgba(225, 29, 72, 0.95);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 16px 0 #7f1d1d, 0 25px 45px rgba(225, 29, 72, 0.7);
      }
    }
    .buzzer-glow-ready {
      animation: buzzer-ready-ring 1.4s infinite cubic-bezier(0.24, 0, 0.38, 1);
    }

    /* Pulsador móvil 3D hiperrealista */
    .buzzer-dome-red {
      background: radial-gradient(circle at 36% 28%, #ff8a8a 0%, #ef4444 35%, #b91c1c 70%, #7f1d1d 95%, #450a0a 100%);
      box-shadow: 
        0 16px 0 #5c0e0e,
        0 22px 35px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(239, 68, 68, 0.6),
        inset 0 4px 10px rgba(255, 255, 255, 0.6),
        inset 0 -6px 12px rgba(0, 0, 0, 0.65);
      transition: all 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .buzzer-dome-red:active {
      transform: translateY(12px) scale(0.985);
      box-shadow: 
        0 4px 0 #5c0e0e,
        0 8px 18px rgba(0, 0, 0, 0.9),
        0 0 45px rgba(239, 68, 68, 0.9),
        inset 0 3px 6px rgba(255, 255, 255, 0.5),
        inset 0 -3px 8px rgba(0, 0, 0, 0.8);
    }

    /* Anillo / Bisel metálico concéntrico del pulsador */
    .buzzer-collar-metal {
      background: conic-gradient(
        from 180deg at 50% 50%,
        #334155 0deg,
        #64748b 45deg,
        #1e293b 90deg,
        #94a3b8 135deg,
        #334155 180deg,
        #64748b 225deg,
        #1e293b 270deg,
        #94a3b8 315deg,
        #334155 360deg
      );
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.9),
        inset 0 3px 6px rgba(255, 255, 255, 0.4),
        inset 0 -5px 10px rgba(0, 0, 0, 0.9);
      border: 3px solid #64748b;
    }

    /* Brillo de turno activo otorgado (verde victoria) */
    @keyframes turn-won-flash {
      0%, 100% {
        box-shadow: 0 0 45px rgba(16, 185, 129, 0.7), 0 0 80px rgba(255, 204, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 70px rgba(16, 185, 129, 0.95), 0 0 110px rgba(255, 204, 0, 0.85);
      }
    }
    .animate-turn-won {
      animation: turn-won-flash 1.2s infinite ease-in-out;
    }

    /* Reflejo brillante de cristal TV en las tarjetas */
    .glossy-clue-card {
      position: relative;
      overflow: hidden;
      transition: all 0.22s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .glossy-clue-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.05) 75%, transparent 100%);
      pointer-events: none;
      border-top-left-radius: inherit;
      border-top-right-radius: inherit;
    }
    .glossy-clue-card:hover {
      transform: scale(1.05);
      filter: brightness(1.15);
      box-shadow: 0 0 30px rgba(255, 204, 0, 0.75), 0 0 12px rgba(212, 175, 55, 0.95), inset 0 1px 3px rgba(255, 255, 255, 0.7);
    }
    .glossy-clue-card:active {
      transform: scale(0.97);
    }

    /* Estilo de casilla respondida (pantalla apagada con textura sutil) */
    .answered-card {
      background: radial-gradient(circle at center, #02061f 0%, #000212 100%) !important;
      border-color: #0c163b !important;
      color: rgba(59, 130, 246, 0.15) !important;
      box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.9) !important;
      cursor: not-allowed !important;
      opacity: 0.45 !important;
      transition: all 0.35s ease;
    }

    /* Barra de desplazamiento discreta y limpia */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: #000324; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>

      // --- SINTETIZADOR DE AUDIO NATIVO RETRO (WEB AUDIO API) ---
      class SoundSynthesizer {
        constructor() {
          this.ctx = null;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        }

        // Tono sutil de navegación o selección
        playSelect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.07);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.09);
        }

        // 1. FANFARRIA RETRO AL ABRIR PREGUNTA (Arpegio de metales con estallido de brillo cristalino)
        playClueOpen() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          
          // Arpegio ascendente de trompetas / metales de concurso de TV
          const fanfareNotes = [233.08, 293.66, 349.23, 466.16, 587.33, 698.46, 932.33]; // Bb3, D4, F4, Bb4, D5, F5, Bb5
          fanfareNotes.forEach((freq, idx) => {
            const st = now + idx * 0.048;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const filter = this.ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, st);

            // Filtro envolvente para simular el ataque brillante de metales de televisión
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, st);
            filter.frequency.exponentialRampToValueAtTime(3600, st + 0.06);
            filter.Q.setValueAtTime(2.5, st);

            gain.gain.setValueAtTime(0.20, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.28);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(st);
            osc.stop(st + 0.29);
          });

          // Acorde sostenido final de victoria de apertura
          const chordStartTime = now + fanfareNotes.length * 0.045;
          const chordFreqs = [466.16, 587.33, 698.46, 932.33];
          chordFreqs.forEach((freq) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, chordStartTime);
            gain.gain.setValueAtTime(0.18, chordStartTime);
            gain.gain.exponentialRampToValueAtTime(0.001, chordStartTime + 0.65);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(chordStartTime);
            osc.stop(chordStartTime + 0.66);
          });

          // Cascada de campanillas doradas brillantes (sparkle glissando)
          const sparkleFreqs = [1864.66, 2349.32, 2793.83, 3729.31];
          sparkleFreqs.forEach((freq, sIdx) => {
            const sTime = chordStartTime + sIdx * 0.05;
            const sOsc = this.ctx.createOscillator();
            const sGain = this.ctx.createGain();
            sOsc.type = 'sine';
            sOsc.frequency.setValueAtTime(freq, sTime);
            sGain.gain.setValueAtTime(0.10, sTime);
            sGain.gain.exponentialRampToValueAtTime(0.001, sTime + 0.4);
            sOsc.connect(sGain);
            sGain.connect(this.ctx.destination);
            sOsc.start(sTime);
            sOsc.stop(sTime + 0.42);
          });
        }

        // Tono de bienvenida / jugador conectado
        playJoin() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.15, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.25);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.27);
          });
        }

        // 2. DING DE BUZZER RETRO (Campanada metálica y chime de pulsador clásico de concurso)
        playBuzz() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Ataque percusivo mecánico inicial (clic físico del pulsador)
          const click = this.ctx.createOscillator();
          const clickGain = this.ctx.createGain();
          click.type = 'triangle';
          click.frequency.setValueAtTime(950, now);
          click.frequency.exponentialRampToValueAtTime(240, now + 0.03);
          clickGain.gain.setValueAtTime(0.35, now);
          clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
          click.connect(clickGain);
          clickGain.connect(this.ctx.destination);
          click.start(now);
          click.stop(now + 0.04);

          // Ding metálico principal de concurso (C6 fundamental + armónicos de campana)
          const dingHarmonics = [
            { freq: 1046.50, gainVal: 0.32, duration: 0.75 }, // C6 campana base
            { freq: 1567.98, gainVal: 0.18, duration: 0.65 }, // G6 armónico
            { freq: 2093.00, gainVal: 0.24, duration: 0.85 }, // C7 octava brillante
            { freq: 3135.96, gainVal: 0.12, duration: 0.45 }, // G7 brillo metálico
            { freq: 4186.01, gainVal: 0.08, duration: 0.35 }  // C8 resplandor cristalino
          ];

          dingHarmonics.forEach(h => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(h.freq, now);
            gain.gain.setValueAtTime(h.gainVal, now);
            gain.gain.exponentialRampToValueAtTime(0.0005, now + h.duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + h.duration + 0.02);
          });

          // Zumbido eléctrico sutil de fondo para timbre de estudio
          const bodyOsc = this.ctx.createOscillator();
          const bodyGain = this.ctx.createGain();
          bodyOsc.type = 'square';
          bodyOsc.frequency.setValueAtTime(523.25, now);
          bodyGain.gain.setValueAtTime(0.08, now);
          bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          bodyOsc.connect(bodyGain);
          bodyGain.connect(this.ctx.destination);
          bodyOsc.start(now);
          bodyOsc.stop(now + 0.3);
        }

        // Alias para consistencia
        playDing() {
          this.playBuzz();
        }

        // 3. ACORDE TRIUNFAL AL ACERTAR (Fanfarria mayor gloriosa con arpegio y campanillas)
        playCorrect() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Arpegio veloz de entrada triunfal
          const arpeggio = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51]; // C5, E5, G5, B5, C6, E6
          arpeggio.forEach((freq, idx) => {
            const st = now + idx * 0.05;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, st);
            gain.gain.setValueAtTime(0.22, st);
            gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(st);
            osc.stop(st + 0.36);
          });

          // Acorde triunfal sostenido pleno (Do Mayor brillante con cuerpo orquestal)
          const chordTime = now + arpeggio.length * 0.048;
          const triumphantChord = [261.63, 392.00, 523.25, 659.25, 783.99, 1046.50, 1318.51]; // C4, G4, C5, E5, G5, C6, E6
          triumphantChord.forEach(freq => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = freq > 1000 ? 'sine' : 'sawtooth';
            osc.frequency.setValueAtTime(freq, chordTime);
            gain.gain.setValueAtTime(freq > 1000 ? 0.12 : 0.15, chordTime);
            gain.gain.exponentialRampToValueAtTime(0.0005, chordTime + 0.88);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(chordTime);
            osc.stop(chordTime + 0.90);
          });

          // Tintineo de campanadas cristalinas de victoria
          const sparkles = [1567.98, 2093.00, 2637.02, 3135.96];
          sparkles.forEach((sf, sIdx) => {
            const spTime = chordTime + 0.1 + sIdx * 0.08;
            const sOsc = this.ctx.createOscillator();
            const sGain = this.ctx.createGain();
            sOsc.type = 'sine';
            sOsc.frequency.setValueAtTime(sf, spTime);
            sGain.gain.setValueAtTime(0.14, spTime);
            sGain.gain.exponentialRampToValueAtTime(0.001, spTime + 0.45);
            sOsc.connect(sGain);
            sGain.connect(this.ctx.destination);
            sOsc.start(spTime);
            sOsc.stop(spTime + 0.47);
          });
        }

        // 4. ZUMBADOR GRAVE AL FALLAR (Clásico "wrong buzzer" / "whammy" disonante de TV)
        playWrong() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Función auxiliar para un estallido de zumbador áspero y grave con tritono disonante
          const makeBuzzBurst = (startTime, duration, baseFreq1, baseFreq2) => {
            const freqs = [baseFreq1, baseFreq2, baseFreq1 / 2]; // Fundamental + tritono disonante + sub-octava
            freqs.forEach(freq => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              const filter = this.ctx.createBiquadFilter();

              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, startTime);

              // Filtro con resonancia para generar la aspereza típica del buzzer retro de TV
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(550, startTime);
              filter.Q.setValueAtTime(4.0, startTime);

              gain.gain.setValueAtTime(0.28, startTime);
              gain.gain.setValueAtTime(0.28, startTime + duration - 0.04);
              gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(startTime);
              osc.stop(startTime + duration + 0.01);
            });
          };

          // Primer golpe áspero (0.20s)
          makeBuzzBurst(now, 0.20, 98.00, 138.59); // Sol2 + Re#3 (tritono discordante)

          // Segundo golpe más largo y grave ("BZZZZ-BZZZZ" icónico de televisión)
          makeBuzzBurst(now + 0.28, 0.38, 82.41, 116.54); // Mi2 + Sib2 (tritono grave)
        }

        // Tic de cuenta regresiva de tensión
        playTick() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1100, now);
          osc.frequency.exponentialRampToValueAtTime(550, now + 0.035);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.045);
        }

        // Alerta urgente de últimos 3 segundos del temporizador
        playUrgentAlert(secondsLeft) {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const baseFreq = secondsLeft === 1 ? 987.77 : (secondsLeft === 2 ? 880 : 783.99);
          [0, 0.08].forEach(d => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(baseFreq, now + d);
            gain.gain.setValueAtTime(0.18, now + d);
            gain.gain.exponentialRampToValueAtTime(0.001, now + d + 0.06);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + d); osc.stop(now + d + 0.07);
          });
        }

        // Fin de tiempo
        playTimeUp() {
          this.init(); if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [0, 0.12, 0.24].forEach((d, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220 + (i * 20), now + d);
            gain.gain.setValueAtTime(0.26, now + d);
            gain.gain.exponentialRampToValueAtTime(0.001, now + d + 0.11);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(now + d); osc.stop(now + d + 0.12);
          });
        }
      }
      const sound = new SoundSynthesizer();

      // Desbloqueo universal de AudioContext ante cualquier gesto del usuario
      const unlockAudioContext = () => { sound.init(); };
      ['click', 'touchstart', 'touchend', 'pointerdown', 'keydown'].forEach(evt => {
        window.addEventListener(evt, unlockAudioContext, { passive: true });
      });

      // Generador de Room Code para emparejamiento WebRTC P2P
      function getOrCreateRoomCode() {
        let code = localStorage.getItem('jeopardy_active_room_code');
        if (!code) {
          code = 'JEP' + Math.floor(1000 + Math.random() * 9000);
          localStorage.setItem('jeopardy_active_room_code', code);

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!parsed.roomCode) parsed.roomCode = getOrCreateRoomCode();
            return parsed;

        } catch (e) {}
        return getDefaultState();

      let state = loadState();
      let isAuthenticated = sessionStorage.getItem(AUTH_KEY) === 'true';

      const urlParams = new URLSearchParams(window.location.search);
      let currentRole = urlParams.get('role') === 'player' ? 'player' : 'host';

      function getTeamColorKey(team) {
        if (!team) return 'azul';
        if (team.colorKey) return team.colorKey;
        const name = (team.name || '').toLowerCase();
        if (name.includes('azul') || name.includes('blue')) return 'azul';
        if (name.includes('rojo') || name.includes('red')) return 'rojo';
        if (name.includes('verde') || name.includes('green')) return 'verde';
        if (name.includes('dora') || name.includes('amar') || name.includes('gold') || name.includes('yellow')) return 'dorado';
        if (name.includes('mora') || name.includes('purp')) return 'morado';
        return team.id || 'azul';
      }

      function getFirebaseSessionId() {
        const rawCode = state.roomCode || roomCodeParam || 'JEP1000';
        return String(rawCode).replace(/[.#$\[\]]/g, '_');

      function initFirebaseRealtimeDB() {
        if (typeof firebase === 'undefined') return;
        try {
          const isConfigured = firebaseConfig.apiKey &&
            !firebaseConfig.apiKey.includes('REEMPLAZA') &&
            firebaseConfig.databaseURL &&
            !firebaseConfig.databaseURL.includes('tu-proyecto');

          if (isConfigured) {
            if (!firebase.apps.length) {
              fbApp = firebase.initializeApp(firebaseConfig);
            } else {
              fbApp = firebase.app();
            }
            fbDb = firebase.database();
            isFirebaseReady = true;
            console.log('🔥 [Firebase Realtime Database] Conexión establecida con la nube.');
            setupFirebaseSessionListeners();
          } else {
            console.info('ℹ️ [Firebase] Esperando credenciales en firebaseConfig. La aplicación está operando en alta disponibilidad mediante WebSocket + REST + PeerJS + BroadcastChannel.');
          }
        } catch (err) {
          console.warn('⚠️ [Firebase] Error inicializando Realtime Database:', err.message);
        }
      }

      function setupFirebaseSessionListeners() {
        if (!fbDb) return;
        const sessionId = getFirebaseSessionId();

        // 1. Escuchar la ruta /sessions/{sessionId}/teams para reflejar participantes en tiempo real
        const teamsRef = fbDb.ref(`sessions/${sessionId}/teams`);
        teamsRef.off();
        teamsRef.on('value', (snapshot) => {
          const teamsVal = snapshot.val();
          if (!teamsVal) return;

          let hasChanges = false;
          Object.keys(teamsVal).forEach(teamKey => {
            const teamNode = teamsVal[teamKey];
            const playersNode = teamNode?.players || {};
            const membersList = Object.keys(playersNode).map(k => {
              const p = playersNode[k];
              return {
                id: p.id || k,
                name: p.name || 'Participante',
                joinedAt: p.joinedAt || Date.now()
              };
            });

            const matched = state.teams.find(t =>
              t.id === teamKey ||
              t.id.toLowerCase() === teamKey.toLowerCase() ||
              getTeamColorKey(t).toLowerCase() === teamKey.toLowerCase() ||
              (t.name && t.name.toLowerCase() === teamKey.toLowerCase())
            );

            if (matched) {
              matched.members = membersList;
              hasChanges = true;
            }
          });

          if (hasChanges) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
            updateLiveParticipantsDOM();
          }
        });

        // 2. Escuchar la cola global de buzzers /sessions/{sessionId}/buzzQueue en tiempo real
        const buzzQueueRef = fbDb.ref(`sessions/${sessionId}/buzzQueue`);
        buzzQueueRef.off();
        buzzQueueRef.on('value', (snapshot) => {
          const qVal = snapshot.val() || {};
          state.buzzerState.buzzQueue = qVal;
          state.buzzerState.buzzers = qVal;
          if (currentRole === 'host') {
            // Si hay pregunta abierta timbrando y no hay turno otorgado aún
            if (state.activeClue && state.activeClue.state === 'buzzing_open' && !state.buzzerState.activeTurn && Object.keys(qVal).length > 0) {
              const candidate = resolveNextTurn(qVal, state.buzzerState.attemptedPlayerIds || []);
              if (candidate) {
                assignTurnToCandidate(candidate);
              }
            } else {
              render();
            }
          } else if (currentRole === 'player') {
            render();
          }
        });

        // 3. Escuchar turno activo /sessions/{sessionId}/activeTurn
        const activeTurnRef = fbDb.ref(`sessions/${sessionId}/activeTurn`);
        activeTurnRef.off();
        activeTurnRef.on('value', (snapshot) => {
          const tVal = snapshot.val();
          state.buzzerState.activeTurn = tVal;
          if (state.gameState) state.gameState.activeTurn = tVal;
          if (tVal) {
            state.buzzerState.buzzedTeamId = tVal.teamId;
            state.buzzerState.buzzedPlayerName = tVal.playerName;
            state.buzzerState.answerTimeRemaining = tVal.answerTimeRemaining ?? 10;
            state.buzzerState.playerAnswer = tVal.playerAnswer || null;
            if (state.activeClue) state.activeClue.state = 'buzzed';
          } else {
            state.buzzerState.buzzedTeamId = null;
            state.buzzerState.buzzedPlayerName = null;
            state.buzzerState.playerAnswer = null;
          }
          if (currentRole === 'player') {
            render();
          }
        });

        // 4. Escuchar pregunta activa /sessions/{sessionId}/activeQuestion
        const activeQuestionRef = fbDb.ref(`sessions/${sessionId}/activeQuestion`);
        activeQuestionRef.off();
        activeQuestionRef.on('value', (snapshot) => {
          const qVal = snapshot.val();
          const prevCycle = state.activeClue?.questionCycleId || state.activeClue?.id;
          if (!qVal) {
            state.activeClue = null;
            state.buzzerState.activeTurn = null;
            state.buzzerState.buzzQueue = {};
            state.buzzerState.buzzers = {};
            state.gameState = {
              status: "board",
              currentQuestion: null,
              buzzQueue: null,
              attemptedPlayerIds: null,
              activeTurn: null,
              showAnswer: false
            };
          } else {
            state.activeClue = {
              id: qVal.questionId,
              questionId: qVal.questionId,
              questionCycleId: qVal.questionCycleId || qVal.timestamp || qVal.questionId,
              categoryId: qVal.categoryId,
              categoryTitle: qVal.categoryTitle,
              value: qVal.value,
              question: qVal.question,
              answer: qVal.answer,
              state: qVal.state
            };
            state.gameState = {
              ...(state.gameState || {}),
              status: "question_open",
              showAnswer: qVal.state === 'revealed',
              currentQuestion: {
                id: qVal.questionId,
                text: qVal.question,
                answer: qVal.answer,
                value: qVal.value,
                catId: qVal.categoryId
              }
            };
            if (qVal.state === 'revealed') {
              state.buzzerState.isOpen = false;
              state.buzzerState.activeTurn = null;
              state.buzzerState.buzzQueue = {};
              state.buzzerState.buzzers = {};
            }
          }
          if (currentRole === 'player') {
            const currentCycle = qVal?.questionCycleId || qVal?.questionId;
            if (qVal && currentCycle !== prevCycle && qVal.state === 'buzzing_open') {
              if ('vibrate' in navigator) navigator.vibrate(200);
              sound.playBuzz();
            }
            render();
          }
        });

        // 5. Escuchar participantes que ya intentaron responder /sessions/{sessionId}/attemptedPlayerIds
        const attemptedRef = fbDb.ref(`sessions/${sessionId}/attemptedPlayerIds`);
        attemptedRef.off();
        attemptedRef.on('value', (snapshot) => {
          const val = snapshot.val();
          state.buzzerState.attemptedPlayerIds = val || {};
          state.buzzerState.answeredPlayersHistory = Array.isArray(val) ? val : (val ? Object.keys(val) : []);
          if (state.gameState) state.gameState.attemptedPlayerIds = val || {};
          if (currentRole === 'player') {

        const statusRef = fbDb.ref(`sessions/${sessionId}/status`);

        statusRef.on('value', (snapshot) => {

          if (sVal === 'closed' && currentRole === 'player') {

            localStorage.removeItem('jeopardy_player_team');
            localStorage.removeItem('jeopardy_player_id');
