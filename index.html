        const boardRef = fbDb.ref(`sessions/${sessionId}/board`);
        boardRef.off();
        boardRef.on('value', (snapshot) => {
          const bVal = snapshot.val();
          if (bVal && bVal.resetTimestamp) {
            state.categories.forEach(cat => {
              cat.clues.forEach(cl => {
                cl.isAnswered = false;
                cl.answeredByTeamId = null;
              });
            });
            state.teams.forEach(t => { t.score = 0; });
            state.activeClue = null;
            state.gameState = {
              status: "board",
              currentQuestion: null,
              buzzQueue: null,
              attemptedPlayerIds: null,
              activeTurn: null,
              showAnswer: false
            };
            state.buzzerState = {
              isOpen: false,
              buzzQueue: {},
              attemptedPlayerIds: {},
              buzzers: {},
              activeTurn: null,
              answeredPlayersHistory: [],
              currentRoundTeams: [],
              buzzedTeamId: null,
              buzzedPlayerName: null,
              buzzedAt: null,
              questionTimeRemaining: 10,
              answerTimeLimit: 10,
              answerTimeRemaining: 10,
              playerAnswer: null,
              lockedTeams: []
            };
            persistState(state);
            if (currentRole === 'host') {
              render();
            }
          }
        });

        // 8. Escuchar nodo raíz de compatibilidad directa /jeopardy_game
        const jeopardyGameRef = fbDb.ref('jeopardy_game');
        jeopardyGameRef.off();
        jeopardyGameRef.on('value', (snapshot) => {
          const gVal = snapshot.val();
          if (gVal) {
            state.gameState = { ...(state.gameState || {}), ...gVal };
            if (gVal.status === 'question_open' && gVal.currentQuestion) {
              const q = gVal.currentQuestion;
              if (!state.activeClue || state.activeClue.id !== q.id) {
                state.activeClue = {
                  id: q.id,
                  questionId: q.id,
                  question: q.text || q.question,
                  answer: q.answer,
                  value: q.value,
                  categoryId: q.catId,
                  state: 'buzzing_open'
                };
              }
            } else if (gVal.status === 'board' || !gVal.currentQuestion) {
              state.activeClue = null;
            } else if (gVal.showAnswer && state.activeClue) {
              state.activeClue.state = 'revealed';
            }

            if (gVal.buzzQueue !== undefined) {
              state.buzzerState.buzzQueue = gVal.buzzQueue || {};
              state.buzzerState.buzzers = gVal.buzzQueue || {};
            }
            if (gVal.attemptedPlayerIds !== undefined) {
              state.buzzerState.attemptedPlayerIds = gVal.attemptedPlayerIds || {};
            }
            if (gVal.activeTurn !== undefined) {
              state.buzzerState.activeTurn = gVal.activeTurn || null;
              if (gVal.activeTurn) {
                state.buzzerState.buzzedTeamId = gVal.activeTurn.teamId;
                state.buzzerState.buzzedPlayerName = gVal.activeTurn.playerName;
              }
            }
            render();
          }
        });
      }

      // 1. WebSocket centralizado al servidor (/ws) con reconexión automática (solo en entornos con backend activo)
      // 2. Respaldo HTTP REST en tiempo real (/api/sync/action y /api/sync/state)
      // 3. BroadcastChannel (Para pestañas del mismo navegador)
      // 4. Storage Events + Timestamps (Para compatibilidad de ventanas locales)
      // 5. WebRTC P2P con PeerJS (Como vía suplementaria)
      // 6. Firebase Realtime Database (Para sincronización global en GitHub Pages y producción)

      const isStaticHost = window.location.hostname.includes('github.io') ||
        window.location.hostname.includes('github.dev') ||
        window.location.protocol === 'file:';

      let ws = null;
      let wsConnected = false;

      function connectWebSocket() {
        if (isStaticHost || !window.location.protocol.startsWith('http')) return;
        try {
          const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${proto}//${window.location.host}/ws`;
          ws = new WebSocket(wsUrl);

          ws.onopen = () => {
            wsConnected = true;
            updateNetworkIndicator(true);
            try {
              ws.send(JSON.stringify({ type: 'GET_STATE' }));
            } catch (e) {}
          };

          ws.onmessage = (evt) => {
            try {
              const data = JSON.parse(evt.data);
              if (data.type === 'STATE_UPDATE' && data.state) {
                applyServerState(data.state);
              } else if (data.type === 'PLAYER_JOINED') {
                if (data.state) {
                  applyServerState(data.state);
                } else if (data.payload) {
                  handleSyncAction('PLAYER_JOIN', data.payload);
                }
                sound.playJoin();
                updateLiveParticipantsDOM();
              } else if (data.type === 'BOARD_RESET' || data.action === 'RESET_BOARD') {
                handleSyncAction('RESET_BOARD', {});
              } else if (data.type === 'AUDIO_TRIGGER') {
                if (data.sound === 'wrong') sound.playWrong();
                else if (data.sound === 'timeup') sound.playTimeUp();
                else if (data.sound === 'buzz') sound.playBuzz();
                if (data.state) applyServerState(data.state);
              } else if (data.type === 'GLOBAL_LOGOUT' || data.type === 'SESSION_TERMINATED' || data.action === 'GLOBAL_LOGOUT') {
                handleSyncAction('GLOBAL_LOGOUT', {});
              } else if (data.action) {
                handleSyncAction(data.action, data.payload);
              }
            } catch (e) {
              console.warn('Error leyendo mensaje WS:', e);
            }
          };

          ws.onclose = () => {
            wsConnected = false;
            updateNetworkIndicator(false);
            setTimeout(connectWebSocket, 1200);
          };

          ws.onerror = () => {
            wsConnected = false;
            updateNetworkIndicator(false);
          };
        } catch (err) {
          console.warn('WebSocket init warning:', err);
        }
      }

      function applyServerState(serverState) {
        if (!serverState) return;

        if (currentRole === 'player') {
          // El móvil adopta el estado del servidor
          const wasOpen = state.buzzerState?.isOpen;
          state.buzzerState = serverState.buzzerState || state.buzzerState;
          state.activeClue = serverState.activeClue || state.activeClue;
          state.teams = serverState.teams || state.teams;
          state.roomCode = serverState.roomCode || state.roomCode;
          state.lastUpdated = serverState.lastUpdated || Date.now();
          if (serverState.status) state.status = serverState.status;

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}

          // Vibración táctil si se acaban de abrir los pulsadores
          if (!wasOpen && serverState.buzzerState?.isOpen && 'vibrate' in navigator) {
            navigator.vibrate(200);
          }
          render();
          return;
        }

        if (currentRole === 'host') {
          const prevTotalMembers = (state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);

          // Sincronizar miembros registrados desde los teléfonos móviles
          if (serverState.teams && Array.isArray(serverState.teams)) {
            serverState.teams.forEach(st => {
              const lt = state.teams.find(t => t.id === st.id || t.name.toLowerCase() === st.name.toLowerCase());
              if (lt) {
                lt.members = st.members || [];
              }
            });
          }

          const newTotalMembers = (state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
          if (newTotalMembers > prevTotalMembers) {
            sound.playJoin();
          }

          // Sincronizar eventos del pulsador móvil
          if (serverState.buzzerState) {
            const sb = serverState.buzzerState;
            if (sb.buzzedTeamId && state.buzzerState.buzzedTeamId !== sb.buzzedTeamId) {
              state.buzzerState = sb;
              if (state.activeClue) state.activeClue.state = 'buzzed';
              sound.playBuzz();
            } else if (sb.playerAnswer && state.buzzerState.playerAnswer !== sb.playerAnswer) {
              state.buzzerState.playerAnswer = sb.playerAnswer;
            } else if (typeof sb.answerTimeRemaining === 'number' && state.buzzerState.buzzedTeamId) {
              state.buzzerState.answerTimeRemaining = sb.answerTimeRemaining;
            }
          }

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e) {}

          updateLiveParticipantsDOM();
          if (state.status !== 'qrcodes' && state.status !== 'setup') {
            render();
          }
        }
      }

      // Polling de seguridad de alta frecuencia (500ms) vía REST (solo en entornos con backend activo)
      setInterval(() => {
        if (isStaticHost || !window.location.protocol.startsWith('http')) return;
        fetch('./api/sync/state')
          .then(res => {
            if (!res.ok) return null;
            return res.json();
          })
          .then(data => {
            if (data && data.state) {
              if (currentRole === 'player') {
                if (data.state.lastUpdated > (state.lastUpdated || 0) || data.state.buzzerState?.isOpen !== state.buzzerState?.isOpen) {
                  applyServerState(data.state);
                }
              } else if (currentRole === 'host') {
                // Verificar si hay nuevos participantes en algún equipo
                let hasChanges = false;
                if (data.state.teams) {
                  data.state.teams.forEach(st => {
                    const lt = state.teams.find(t => t.id === st.id || t.name.toLowerCase() === st.name.toLowerCase());
                    if (lt && JSON.stringify(lt.members) !== JSON.stringify(st.members)) {
                      lt.members = st.members || [];
                      hasChanges = true;
                    }
                  });
                }
                // O si alguien pulsó
                if (data.state.buzzerState?.buzzedTeamId && !state.buzzerState.buzzedTeamId) {
                  applyServerState(data.state);
                } else if (hasChanges) {
                  render();
                }
              }
            }
          })
          .catch(() => {});
      }, 500);

      let bc = null;
      try {
        if ('BroadcastChannel' in window) {
          bc = new BroadcastChannel(BROADCAST_CHANNEL_NAME);
          bc.onmessage = (evt) => {
            if (!evt.data) return;
            // Si viene un snapshot completo del estado
            if (evt.data.state) {
              const prevMembersCount = (state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              const newMembersCount = (evt.data.state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              state = evt.data.state;
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              } catch (e) {}
              if (newMembersCount > prevMembersCount) sound.playJoin();
              render();
              return;
            }
            if (evt.data.action) {
              handleSyncAction(evt.data.action, evt.data.payload);
            }
          };
        }
      } catch (e) {}

      // Escucha inmediata de Storage Events de almacenamiento local entre ventanas/pestañas
      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY || e.key === LEGACY_STORAGE_KEY || e.key === SYNC_TRIGGER_KEY || e.key === SYNC_EVENT_KEY) {
          try {
            const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
            if (raw) {
              const freshState = JSON.parse(raw);
              const prevMembersCount = (state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              const newMembersCount = (freshState.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              state = freshState;
              if (newMembersCount > prevMembersCount) {
                sound.playJoin();
              }
              render();
            }
          } catch (err) {}
        }
        if (e.key === SYNC_EVENT_KEY && e.newValue) {
          try {
            const data = JSON.parse(e.newValue);
            if (data && data.action) {
              handleSyncAction(data.action, data.payload);
            }
          } catch (err) {}
        }
      });

      // Polling de ultra-baja latencia (300ms) en localStorage como garantía absoluta de sincronización
      setInterval(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
          if (raw) {
            const s = JSON.parse(raw);
            const currentMembersSummary = (state.teams || []).map(t => `${t.id}:${(t.members||[]).map(m=>m.name).join(',')}`).join('|');
            const newMembersSummary = (s.teams || []).map(t => `${t.id}:${(t.members||[]).map(m=>m.name).join(',')}`).join('|');
            if (currentMembersSummary !== newMembersSummary || (s.buzzerState?.isOpen !== state.buzzerState?.isOpen && currentRole === 'player')) {
              const prevTotal = (state.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              const newTotal = (s.teams || []).reduce((acc, t) => acc + (t.members?.length || 0), 0);
              state.teams = s.teams;
              if (s.buzzerState) state.buzzerState = s.buzzerState;
              if (s.activeClue) state.activeClue = s.activeClue;
              state.lastUpdated = s.lastUpdated || Date.now();
              if (newTotal > prevTotal && currentRole === 'host') sound.playJoin();
              render();
            }
          }
        } catch (e) {}
      }, 300);

      // --- CONEXIÓN P2P WEBRTC (PEERJS) COMO VÍA SECUNDARIA ---
      let hostPeer = null;
      let hostConnections = [];
      let playerPeer = null;
      let playerConnection = null;

      function initNetworkSync() {
        initFirebaseRealtimeDB();
        connectWebSocket();

        if (typeof Peer === 'undefined') return;

        if (currentRole === 'host') {
          const hostPeerId = `jeopardy-host-${state.roomCode}`;
          try {
            hostPeer = new Peer(hostPeerId, { debug: 0 });
            hostPeer.on('open', () => {
              updateNetworkIndicator(true);
            });
            hostPeer.on('connection', (conn) => {
              hostConnections.push(conn);
              conn.on('open', () => {
                conn.send({ action: 'STATE_SNAPSHOT', payload: state });
              });
              conn.on('data', (data) => {
                if (data && data.action) {
                  handleSyncAction(data.action, data.payload);
                  hostConnections.forEach(c => {
                    if (c !== conn && c.open) c.send(data);
                  });
                }
              });
              conn.on('close', () => {
                hostConnections = hostConnections.filter(c => c !== conn);
              });
            });
          } catch (e) {
            console.warn(e);
          }
        } else if (currentRole === 'player') {
          const targetHostId = `jeopardy-host-${roomCodeParam}`;
          try {
            playerPeer = new Peer(null, { debug: 0 });
            playerPeer.on('open', () => {
              playerConnection = playerPeer.connect(targetHostId, { reliable: true });
              playerConnection.on('open', () => {
                updateNetworkIndicator(true);
              });
              playerConnection.on('data', (data) => {
                if (data && data.action) {
                  handleSyncAction(data.action, data.payload);
                }
              });
              playerConnection.on('close', () => {
                if (!wsConnected) updateNetworkIndicator(false);
              });
            });
          } catch (e) {
            console.warn(e);
          }
        }
      }

      function updateNetworkIndicator(isConnected) {
        const dots = document.querySelectorAll('.sync-status-dot');
        dots.forEach(d => {
          if (isConnected || wsConnected) {
            d.classList.remove('bg-amber-400');
            d.classList.add('bg-emerald-400');
            d.setAttribute('title', 'Sincronizado en tiempo real (WebSocket + P2P)');
          } else {
            d.classList.remove('bg-emerald-400');
            d.classList.add('bg-amber-400');
            d.setAttribute('title', 'Sincronizando...');
          }
        });
      }

      // Despachador universal de acciones
      function dispatchAction(action, payload) {
        // 1. Ejecutar localmente
        handleSyncAction(action, payload);

        // 2. Transmitir por WebSocket en tiempo real
        if (ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({ type: 'ACTION', action, payload }));
          } catch (e) {}
        }

        // 3. Transmitir por REST HTTP redundante (solo en entornos con backend activo)
        if (!isStaticHost && window.location.protocol.startsWith('http')) {
          fetch('./api/sync/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, payload })
          }).then(r => {
            if (!r.ok) return null;
            return r.json();
          }).then(res => {
            if (res && res.state && currentRole === 'player') {
              applyServerState(res.state);
            }
          }).catch(() => {});
        }

        // 4. Transmitir por BroadcastChannel
        try {
          if (bc) bc.postMessage({ action, payload, ts: Date.now() });
        } catch (e) {}

        // 5. Transmitir por Storage Event (cambio forzado de valor)
        try {
          localStorage.setItem(SYNC_EVENT_KEY, JSON.stringify({ action, payload, ts: Date.now() }));
        } catch (e) {}

        // 6. Transmitir por WebRTC DataChannel
        if (currentRole === 'host' && hostConnections.length > 0) {
          hostConnections.forEach(c => {
            if (c.open) c.send({ action, payload });
          });
        } else if (currentRole === 'player' && playerConnection && playerConnection.open) {
          playerConnection.send({ action, payload });
        }
      }

      function persistState(newState, broadcast = true) {
        newState.lastUpdated = Date.now();
        state = newState;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}

        if (broadcast) {
          // 1. Transmitir por WebSocket
          if (ws && ws.readyState === WebSocket.OPEN) {
            try {
              ws.send(JSON.stringify({ type: 'STATE_SNAPSHOT', state: newState }));
            } catch (e) {}
          }

          // 2. Transmitir por REST HTTP
          if (window.location.protocol.startsWith('http')) {
            fetch('/api/sync/action', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'STATE_SNAPSHOT', payload: newState })
            }).catch(() => {});
          }

          // 3. Transmitir por BroadcastChannel a otras pestañas
          try {
            if (bc) bc.postMessage({ action: 'STATE_SNAPSHOT', payload: state, ts: Date.now() });
          } catch (e) {}

          // 4. Disparar Storage Event para sincronización inmediata entre ventanas
          try {
            localStorage.setItem(SYNC_EVENT_KEY, JSON.stringify({ action: 'STATE_SNAPSHOT', payload: state, ts: Date.now() }));
          } catch (e) {}

          // 5. Transmitir inmediatamente a los teléfonos móviles conectados por WebRTC
          if (currentRole === 'host' && hostConnections.length > 0) {
            hostConnections.forEach(c => {
              if (c.open) c.send({ action: 'STATE_SNAPSHOT', payload: state });
            });
          } else if (currentRole === 'player' && playerConnection && playerConnection.open) {
            playerConnection.send({ action: 'STATE_SNAPSHOT', payload: state });
          }
        }

        render();
      }

      // Actualización reactiva y sin parpadeo del listado de participantes y contadores
      function updateLiveParticipantsDOM() {
        if (currentRole !== 'host') return;
        const teamCount = state.teamCount || state.teams.length;
        const activeTeams = state.teams.slice(0, teamCount);
        const totalConnected = activeTeams.reduce((acc, t) => acc + (t.members?.length || 0), 0);

        // 1. Vista de Códigos QR (renderQRCodesScreen)
        activeTeams.forEach((team) => {
          const countEl = document.getElementById(`qr-team-count-${team.id}`);
          if (countEl) {
            countEl.textContent = `${team.members.length} / ${state.maxMembersPerTeam >= 999 ? '∞' : state.maxMembersPerTeam} registrados`;
          }
          const badgeCountEl = document.getElementById(`qr-team-badge-count-${team.id}`);
          if (badgeCountEl) {
            badgeCountEl.textContent = String(team.members.length);
          }
          const membersBox = document.getElementById(`qr-team-members-${team.id}`);
          if (membersBox) {
            if (team.members.length === 0) {
              membersBox.innerHTML = `
                <span class="text-[11px] text-blue-400/60 italic py-1">
                  Esperando participantes...
                </span>
              `;
            } else {
              membersBox.innerHTML = team.members.map(m => `
                <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-900/90 text-white border border-blue-500 shadow-sm animate-in zoom-in-95">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span class="truncate max-w-[80px]">${m.name}</span>
                  <button
                    type="button"
                    data-team-id="${team.id}"
                    data-member-id="${m.id}"
                    class="btn-remove-member hover:text-rose-400 text-xs font-black ml-0.5 cursor-pointer"
                    title="Remover participante"
                  >×</button>
                </span>
              `).join('');

              membersBox.querySelectorAll('.btn-remove-member').forEach(btn => {
                btn.addEventListener('click', (e) => {
                  e.stopPropagation();
                  const tId = btn.getAttribute('data-team-id');
                  const mId = btn.getAttribute('data-member-id');
                  dispatchAction('PLAYER_REMOVE', { teamId: tId, memberId: mId });
                });
              });
            }
          }

          // 2. Vista de Configuración Inicial (renderSetupScreen)
          const setupCountEl = document.getElementById(`setup-team-count-${team.id}`);
          if (setupCountEl) {
            setupCountEl.textContent = `${team.members?.length || 0} / ${state.maxMembersPerTeam >= 999 ? '∞' : state.maxMembersPerTeam}`;
          }
          const setupMembersBox = document.getElementById(`setup-team-members-${team.id}`);
          if (setupMembersBox) {
            if ((team.members || []).length === 0) {
              setupMembersBox.innerHTML = `<span class="text-[10px] text-blue-400/60 italic py-1">Esperando...</span>`;
            } else {
              setupMembersBox.innerHTML = team.members.map(m => `
                <span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-blue-900 text-white border border-blue-500 shadow-sm">
                  ${m.name}
                </span>
              `).join('');
            }
          }
        });

        // Contadores globales
        const qrTotalEl = document.getElementById('qr-total-connected-count');
        if (qrTotalEl) {
          qrTotalEl.textContent = String(totalConnected);
        }
        const setupTotalEl = document.getElementById('setup-total-connected-count');
        if (setupTotalEl) {
          setupTotalEl.innerHTML = `
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            ${totalConnected} Conectados
          `;
        }
      }

      // Función de reseteo completo del tablero y marcadores
      function executeResetBoard() {
        sound.playSelect();
        // 1. Restaurar marcadores a $0
        state.teams = state.teams.map(t => ({
          ...t,
          score: 0
        }));

        // 2. Restaurar todas las tarjetas de preguntas con sus valores originales y no respondidas
        state.categories = state.categories.map(c => ({
          ...c,
          clues: c.clues.map(cl => ({
            ...cl,
            isAnswered: false,
            answeredByTeamId: null
          }))
        }));

        // 3. Resetear buzzer/pulsador a desbloqueado y sin turnos pendientes
        state.activeClue = null;
        state.buzzerState = {
          isOpen: false,
          buzzedTeamId: null,
          buzzedPlayerName: null,
          buzzedAt: null,
          answerTimeLimit: 10,
          answerTimeRemaining: 10,
          playerAnswer: null,
          lockedTeams: [],
          firstAttemptTeamId: null,
          hasReboundedToFirst: false,
          attemptedMembers: []
        };

        // 4. Persistir localmente
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}

        // 5. Sincronizar en Firebase Realtime Database
        if (fbDb) {
          const sessionId = getFirebaseSessionId();
          fbDb.ref(`sessions/${sessionId}/board`).set({
            resetTimestamp: Date.now(),
            scores: state.teams.reduce((acc, t) => { acc[t.id] = 0; return acc; }, {}),
            answeredClues: {}
          }).catch(err => console.warn('Firebase reset board error:', err));
        }

        // 6. Transmitir de inmediato al servidor y a todos los clientes
        dispatchAction('RESET_BOARD', {});

        // 7. Endpoint REST directo de respaldo
        if (window.location.protocol.startsWith('http')) {
          fetch('/api/game/reset', { method: 'POST' }).catch(() => {});
        }

        render();
      }

      // Procesador centralizado de acciones sincronizadas
      function handleSyncAction(action, payload) {
        switch (action) {
          case 'PLAYER_JOIN': {
            const rawTeam = payload?.teamId;
            const cleanName = String(payload?.playerName || payload?.memberName || '').trim();
            const memberId = String(payload?.sessionId || payload?.memberId || ('m-' + Date.now())).trim();
            if (!cleanName || !rawTeam) break;

            // 1. Quitar al jugador de cualquier otro equipo para evitar duplicados
            let updatedTeams = state.teams.map(t => ({
              ...t,
              members: (t.members || []).filter(m => m.name.toLowerCase() !== cleanName.toLowerCase() && m.id !== memberId)
            }));

            // 2. Buscar equipo por id o nombre
            let targetTeam = updatedTeams.find(t => 
              t.id === rawTeam || 
              t.name.toLowerCase() === String(rawTeam).toLowerCase() ||
              t.id.toLowerCase() === String(rawTeam).toLowerCase()
            );
            if (!targetTeam && updatedTeams.length > 0) targetTeam = updatedTeams[0];

            if (targetTeam) {
              const max = state.maxMembersPerTeam || 5;
              if (max === 0 || targetTeam.members.length < max) {
                targetTeam.members.push({
                  id: memberId,
                  name: cleanName,
                  joinedAt: Date.now()
                });
              }
            }

            state.teams = updatedTeams;
            state.lastUpdated = Date.now();
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}

            sound.playJoin();
            updateLiveParticipantsDOM();
            if (state.status !== 'qrcodes' && state.status !== 'setup') {
              render();
            }
            break;
          }

          case 'RESET_BOARD': {
            state.categories = state.categories.map(c => ({
              ...c,
              clues: c.clues.map(cl => ({
                ...cl,
                isAnswered: false,
                answeredByTeamId: null
              }))
            }));
            state.teams = state.teams.map(t => ({
              ...t,
              score: 0
            }));
            state.activeClue = null;
            state.buzzerState = {
              isOpen: false,
              buzzedTeamId: null,
              buzzedPlayerName: null,
              buzzedAt: null,
              answerTimeLimit: 10,
              answerTimeRemaining: 10,
              playerAnswer: null,
              lockedTeams: [],
              firstAttemptTeamId: null,
              hasReboundedToFirst: false,
              attemptedMembers: []
            };
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
            sound.playSelect();
            render();
            break;
          }

          case 'GLOBAL_LOGOUT': {
            if (currentRole === 'player') {
              localStorage.removeItem('jeopardy_player_name');
              localStorage.removeItem('jeopardy_player_team');
              localStorage.removeItem('jeopardy_player_id');
              localStorage.removeItem('jeopardy_player_registered');
              renderPlayerSessionClosedScreen();
            } else {
              isAuthenticated = false;
              sessionStorage.clear();
              state = getDefaultState();
              state.status = 'setup';
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
              } catch (e) {}
              render();
            }
            break;
          }

          case 'PLAYER_REMOVE': {
            const { teamId, memberId } = payload;
            const updatedTeams = state.teams.map(t => {
              if (t.id === teamId) {
                return { ...t, members: t.members.filter(m => m.id !== memberId) };
              }
              return t;
            });
            persistState({ ...state, teams: updatedTeams });
            break;
          }

          case 'PLAYER_BUZZ': {
            const { teamId, memberName, timestamp, playerId, playerName } = payload || {};
            handlePlayerBuzz({
              playerId: playerId || payload.memberId || ('m-' + (timestamp || Date.now())),
              playerName: playerName || memberName || 'Participante',
              teamId: teamId,
              timestamp: Number(timestamp) || Date.now()
            });
            break;
          }

          case 'PLAYER_ANSWER': {
            const { answer } = payload;
            sound.playSelect();
            const updatedBuzzer = {
              ...state.buzzerState,
              playerAnswer: answer
            };
            persistState({ ...state, buzzerState: updatedBuzzer });
            break;
          }

          case 'STATE_SNAPSHOT': {
            if (payload && (!state.lastUpdated || payload.lastUpdated >= state.lastUpdated)) {
              state = payload;
              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              } catch (e) {}
              render();
            }
            break;
          }

          default:
            break;
        }
      }

      // =========================================================================
      // UTILIDADES DE NORMALIZACIÓN Y VERIFICACIÓN DE INTENTOS
      // =========================================================================
      function normalizeAttemptedPlayerIds(attempted) {
        if (!attempted) return [];
        if (Array.isArray(attempted)) {
          return attempted.filter(id => id && typeof id === 'string');
        }
        if (typeof attempted === 'object') {
          const ids = new Set();
          for (const key of Object.keys(attempted)) {
            const val = attempted[key];
            if (typeof val === 'boolean' && val) {
              ids.add(key);
            } else if (typeof val === 'string' && val) {
              ids.add(val);
            } else if (key && val) {
              ids.add(key);
            }
          }
          return Array.from(ids);
        }
        return [];
      }

      function isPlayerAttempted(attempted, playerId) {
        if (!attempted || !playerId) return false;
        if (Array.isArray(attempted)) {
          return attempted.includes(playerId);
        }
        if (typeof attempted === 'object') {
          if (attempted[playerId] !== undefined && attempted[playerId] !== null) {
            return Boolean(attempted[playerId]);
          }
          return Object.values(attempted).includes(playerId);
        }
        return false;
      }

      // =========================================================================
      // ALGORITMO DETERMINISTA DE RESOLUCIÓN DE TURNOS POR RONDAS (ROUND-ROBIN ESTRICTO)
      // =========================================================================
      function resolveNextTurn(buzzQueue, attemptedPlayerIds = []) {
        // 1. Normalizar buzzQueue en un array ordenado cronológicamente por timestamp ascendente
        let queue = [];
        if (Array.isArray(buzzQueue)) {
          queue = buzzQueue.filter(Boolean).map(v => ({ ...v }));
        } else if (buzzQueue && typeof buzzQueue === 'object') {
          queue = Object.entries(buzzQueue)
            .filter(([k, v]) => v && typeof v === 'object')
            .map(([k, v]) => ({
              ...v,
              id: v.id || k
            }));
        }

        queue = queue.filter(b => b && b.playerId && b.teamId);
        queue.sort((a, b) => {
          const tA = Number(a.timestamp) || 0;
          const tB = Number(b.timestamp) || 0;
          if (tA !== tB) return tA - tB;
          return String(a.id || a.playerId).localeCompare(String(b.id || b.playerId));
        });

        // 2. Exclusión individual definitiva: Un participante cuyo playerId esté en attemptedPlayerIds jamás vuelve a tener turno en la misma pregunta
        const attemptedList = normalizeAttemptedPlayerIds(attemptedPlayerIds);
        const attemptedSet = new Set(attemptedList);

        const eligible = queue.filter(b => !attemptedSet.has(b.playerId));
        if (eligible.length === 0) {
          return null; // Nadie elegible en la cola
        }

        // 3. Contabilizar intentos ya realizados por equipo en esta pregunta
        const attemptsByTeam = {};
        attemptedList.forEach(pid => {
          const entry = queue.find(q => q.playerId === pid);
          let teamId = entry?.teamId;
          if (!teamId && state && state.teams) {
            const team = state.teams.find(t => (t.members || []).some(m => m.id === pid));
            if (team) teamId = team.id;
          }
          if (teamId) {
            attemptsByTeam[teamId] = (attemptsByTeam[teamId] || 0) + 1;
          }
        });

        // 4. Equipos con al menos un concursante elegible en la cola
        const eligibleTeams = Array.from(new Set(eligible.map(e => e.teamId)));

        // 5. Determinar la ronda actual: mínimo de intentos entre equipos con concursantes elegibles
        const minAttempts = Math.min(...eligibleTeams.map(tId => attemptsByTeam[tId] || 0));

        // 6. Asignar el turno a la primera persona en la cola cronológica cuyo equipo esté en la ronda actual
        const candidate = eligible.find(item => (attemptsByTeam[item.teamId] || 0) === minAttempts);

        return candidate || eligible[0] || null;
      }

      function getNextTurn(buzzQueue, attemptedPlayerIds = []) {
        const cand = resolveNextTurn(buzzQueue, attemptedPlayerIds);
        if (!cand) return null;
        return { candidate: cand, nextRoundTeams: [cand.teamId] };
      }

      function assignTurnToCandidate(candidate) {
        if (!candidate) return;
        if (questionTimerInterval) {
          clearInterval(questionTimerInterval);
          questionTimerInterval = null;
        }
        sound.playBuzz();

        const activeTurn = {
          playerId: candidate.playerId,
          playerName: candidate.playerName,
          teamId: candidate.teamId,
          timestamp: candidate.timestamp,
          answerTimeRemaining: 10,
          playerAnswer: null
        };

        state.activeClue = { ...state.activeClue, state: 'buzzed' };
        state.buzzerState = {
          ...state.buzzerState,
          isOpen: false,
          activeTurn: activeTurn,
          buzzedTeamId: candidate.teamId,
          buzzedPlayerName: candidate.playerName,
          buzzedAt: candidate.timestamp,
          answerTimeRemaining: 10,
          questionTimeRemaining: 10,
          playerAnswer: null
        };

        setupAnswerTimer();
        sound.playBuzz();
        persistState(state);

        if (fbDb) {
          const sessionId = getFirebaseSessionId();
          fbDb.ref(`sessions/${sessionId}/activeTurn`).set(activeTurn).catch(() => {});
          fbDb.ref(`sessions/${sessionId}/activeQuestion/state`).set('buzzed').catch(() => {});
        }
      }

      // MANEJO AUTORITATIVO DE LA COLA GLOBAL DE BUZZERS
      function handlePlayerBuzz(payload) {
        const clue = state.activeClue;
        if (!clue || clue.state === 'revealed') return;

        const b = state.buzzerState || {};
        const currentQueue = { ...(b.buzzQueue || b.buzzers || {}) };
        const playerId = payload.playerId;
        if (!playerId) return;

        // Captura única por pregunta (evita envíos dobles)
        const alreadyInQueue = Object.values(currentQueue).some(entry => entry && entry.playerId === playerId);
        if (alreadyInQueue) return;

        // Exclusión individual definitiva: si ya intentó responder en esta pregunta, ignorar
        if (isPlayerAttempted(b.attemptedPlayerIds, playerId) || isPlayerAttempted(state.gameState?.attemptedPlayerIds, playerId)) return;

        const pushKey = 'bq_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        const newEntry = {
          id: pushKey,
          playerId: playerId,
          playerName: String(payload.playerName || payload.memberName || 'Participante').trim(),
          teamId: payload.teamId,
          timestamp: Number(payload.timestamp) || Date.now()
        };

        currentQueue[pushKey] = newEntry;
        state.buzzerState.buzzQueue = currentQueue;
        state.buzzerState.buzzers = currentQueue;

        // CASO A: Nadie tiene el turno actualmente y la pregunta está abierta para timbres
        if (!state.buzzerState.activeTurn && clue.state === 'buzzing_open') {
          const candidate = resolveNextTurn(currentQueue, normalizeAttemptedPlayerIds(b.attemptedPlayerIds));
          if (candidate) {
            assignTurnToCandidate(candidate);
            return;
          }
        }

        // CASO B: Ya hay un turno activo -> el buzzer queda registrado en la cola ordenada
        persistState(state);
      }

      // TEMPORIZADOR 1: Cuenta regresiva de 10 segundos para pulsar (Si nadie presiona)
      let questionTimerInterval = null;
      function setupQuestionTimer() {
        if (questionTimerInterval) {
          clearInterval(questionTimerInterval);
          questionTimerInterval = null;
        }

        if (currentRole !== 'host') return;
        if (!state.activeClue || state.activeClue.state !== 'buzzing_open') {
          return;
        }

        if (typeof state.buzzerState.questionTimeRemaining !== 'number') {
          state.buzzerState.questionTimeRemaining = 10;
        }

        questionTimerInterval = setInterval(() => {
          if (!state.activeClue || state.activeClue.state !== 'buzzing_open' || state.buzzerState.activeTurn) {
            clearInterval(questionTimerInterval);
            questionTimerInterval = null;
            return;
          }

          const currentRem = state.buzzerState.questionTimeRemaining ?? 10;
          if (currentRem <= 1) {
            clearInterval(questionTimerInterval);
            questionTimerInterval = null;
            sound.playTimeUp();
            // Si nadie pulsó en 10 segundos -> revelar automáticamente la respuesta correcta
            const nextState = closeAndRevealClue(state);
            persistState(nextState);
          } else {
            const nextRem = currentRem - 1;
            state.buzzerState.questionTimeRemaining = nextRem;
            if (nextRem <= 3 && nextRem > 0) {
              sound.playUrgentAlert(nextRem);
            } else if (nextRem > 3) {
              sound.playTick();
            }

            const timerBadge = document.getElementById('question-timer-badge');
            if (timerBadge) timerBadge.textContent = `${nextRem}s`;
            const timerBar = document.getElementById('question-timer-bar');
            if (timerBar) timerBar.style.width = `${(nextRem / 10) * 100}%`;

            persistState(state, false);
          }
        }, 1000);
      }

      // TEMPORIZADOR 2: Cuenta regresiva de 10 segundos para responder (Equipo / Jugador con el turno)
      let timerInterval = null;
      function setupAnswerTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        if (currentRole !== 'host') return;
        if (!state.activeClue || state.activeClue.state !== 'buzzed' || !state.buzzerState.activeTurn) {
          return;
        }

        timerInterval = setInterval(() => {
          if (!state.activeClue || state.activeClue.state !== 'buzzed' || !state.buzzerState.activeTurn) {
            clearInterval(timerInterval);
            timerInterval = null;
            return;
          }

          if (state.buzzerState.playerAnswer || state.buzzerState.activeTurn?.playerAnswer) {
            return;
          }

          const currentRem = state.buzzerState.answerTimeRemaining ?? 10;
          if (currentRem <= 1) {
            clearInterval(timerInterval);
            timerInterval = null;
            sound.playTimeUp();
            sound.playWrong();
            handleTeamFailedAnswer(state.buzzerState.activeTurn.teamId, true);
          } else {
            const nextRem = currentRem - 1;
            state.buzzerState.answerTimeRemaining = nextRem;
            if (state.buzzerState.activeTurn) {
              state.buzzerState.activeTurn.answerTimeRemaining = nextRem;
            }
            if (nextRem <= 3 && nextRem > 0) {
              sound.playUrgentAlert(nextRem);
            } else if (nextRem > 3) {
              sound.playTick();
            }

            const timerBadge = document.getElementById('player-timer-badge');
            if (timerBadge) timerBadge.textContent = `${nextRem}s`;
            const timerBar = document.getElementById('player-timer-bar');
            if (timerBar) timerBar.style.width = `${(nextRem / 10) * 100}%`;

            persistState(state, false);
            if (fbDb) {
              const sessionId = getFirebaseSessionId();
              fbDb.ref(`sessions/${sessionId}/activeTurn/answerTimeRemaining`).set(nextRem).catch(() => {});
            }
          }
        }, 1000);
      }

      // LÓGICA ESTRICTA DE REASIGNACIÓN DE TURNO POR RESPUESTA INCORRECTA
      function handleTeamFailedAnswer(failedTeamId, isTimeout = false) {
        sound.playWrong();
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }

        const b = state.buzzerState || {};
        const clue = state.activeClue;
        if (!clue) return;

        const currentTurn = state.gameState?.activeTurn || b.activeTurn;
        const failedPlayerId = currentTurn?.playerId;

        // 1. Exclusión individual definitiva: Registrar al jugador en attemptedPlayerIds
        let updatedAttemptedMap = { ...(state.gameState?.attemptedPlayerIds || {}) };
        if (failedPlayerId) {
          updatedAttemptedMap[failedPlayerId] = true;
        }

        let updatedAttemptedList = normalizeAttemptedPlayerIds(updatedAttemptedMap);
        if (failedPlayerId && !updatedAttemptedList.includes(failedPlayerId)) {
          updatedAttemptedList.push(failedPlayerId);
        }

        // 2. Penalizar puntuación si está configurado en settings
        const targetTeamId = failedTeamId || currentTurn?.teamId;
        const updatedTeams = state.teams.map(t => {
          if (t.id === targetTeamId && state.settings.penalizeWrong) {
            return { ...t, score: t.score - clue.value };
          }
          return t;
        });

        state.teams = updatedTeams;
        state.buzzerState.attemptedPlayerIds = updatedAttemptedMap;
        state.buzzerState.answeredPlayersHistory = updatedAttemptedList;
        if (state.gameState) {
          state.gameState.attemptedPlayerIds = updatedAttemptedMap;
        }

        // 3. Invocar inmediatamente resolveNextTurn para pasar la palabra al siguiente participante elegible
        const queueObj = state.gameState?.buzzQueue || b.buzzQueue || b.buzzers || {};
        const nextCandidate = resolveNextTurn(queueObj, updatedAttemptedList);

        if (nextCandidate) {
          sound.playBuzz();
          const now = Date.now();

          const nextActiveTurn = {
            playerId: nextCandidate.playerId,
            playerName: nextCandidate.playerName,
            teamId: nextCandidate.teamId,
            timestamp: nextCandidate.timestamp,
            startTime: now,
            expiresAt: now + 10000,
            answerTimeRemaining: 10,
            playerAnswer: null
          };

          state.activeClue = { ...clue, state: 'buzzed' };
          state.buzzerState = {
            ...b,
            isOpen: false,
            activeTurn: nextActiveTurn,
            buzzedTeamId: nextCandidate.teamId,
            buzzedPlayerName: nextCandidate.playerName,
            buzzedAt: nextCandidate.timestamp,
            attemptedPlayerIds: updatedAttemptedMap,
            answeredPlayersHistory: updatedAttemptedList,
            answerTimeRemaining: 10,
            playerAnswer: null
          };
          if (state.gameState) {
            state.gameState.activeTurn = nextActiveTurn;
            state.gameState.timerExpiresAt = now + 10000;
          }

          setupAnswerTimer();
          persistState(state);

          if (fbDb) {
            const sessionId = getFirebaseSessionId();
            fbDb.ref("jeopardy_game").update({
              activeTurn: nextActiveTurn,
              attemptedPlayerIds: updatedAttemptedMap,
              timerExpiresAt: now + 10000
            }).catch(() => {});
            fbDb.ref(`sessions/${sessionId}`).update({
              activeTurn: nextActiveTurn,
              attemptedPlayerIds: updatedAttemptedMap,
              timerExpiresAt: now + 10000
            }).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/activeTurn`).set(nextActiveTurn).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/attemptedPlayerIds`).set(updatedAttemptedMap).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/activeQuestion/state`).set('buzzed').catch(() => {});
          }
        } else {
          // Si no quedan concursantes elegibles en buzzQueue, revelar de inmediato la respuesta correcta en pantalla
          if (fbDb) {
            const sessionId = getFirebaseSessionId();
            fbDb.ref("jeopardy_game").update({
              status: "question_open",
              showAnswer: true,
              activeTurn: null,
              attemptedPlayerIds: updatedAttemptedMap
            }).catch(() => {});
            fbDb.ref(`sessions/${sessionId}`).update({
              status: "question_open",
              showAnswer: true,
              activeTurn: null,
              attemptedPlayerIds: updatedAttemptedMap
            }).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/attemptedPlayerIds`).set(updatedAttemptedMap).catch(() => {});
          }
          const nextState = closeAndRevealClue(state);
          persistState(nextState);
        }
      }

      function closeAndRevealClue(targetState) {
        if (questionTimerInterval) { clearInterval(questionTimerInterval); questionTimerInterval = null; }
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

        const clue = targetState.activeClue;
        const nextCats = targetState.categories.map(cat => ({
          ...cat,
          clues: cat.clues.map(c => c.id === clue.id ? { ...c, isAnswered: true } : c)
        }));

        if (fbDb) {
          const sessionId = getFirebaseSessionId();
          fbDb.ref("jeopardy_game").update({
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          }).catch(() => {});
          fbDb.ref(`sessions/${sessionId}`).update({
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          }).catch(() => {});
          fbDb.ref(`sessions/${sessionId}/activeQuestion/state`).set('revealed').catch(() => {});
          fbDb.ref(`sessions/${sessionId}/activeTurn`).set(null).catch(() => {});
        }

        return {
          ...targetState,
          categories: nextCats,
          activeClue: { ...clue, state: 'revealed' },
          gameState: {
            ...(targetState.gameState || {}),
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          },
          buzzerState: {
            ...targetState.buzzerState,
            isOpen: false,
            activeTurn: null,
            buzzedTeamId: null,
            buzzedPlayerName: null,
            playerAnswer: null,
            questionTimeRemaining: 0,
            answerTimeRemaining: 0
          }
        };
      }

      function handleTeamCorrectAnswer() {
        sound.playCorrect();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 90, spread: 75, origin: { y: 0.6 } });
        }
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        if (questionTimerInterval) { clearInterval(questionTimerInterval); questionTimerInterval = null; }

        const clue = state.activeClue;
        const b = state.buzzerState;
        const winningTeamId = b.activeTurn?.teamId || b.buzzedTeamId;

        const updatedTeams = state.teams.map(t => {
          if (t.id === winningTeamId) {
            return { ...t, score: t.score + clue.value };
          }
          return t;
        });

        const nextCats = state.categories.map(cat => ({
          ...cat,
          clues: cat.clues.map(c => c.id === clue.id ? { ...c, isAnswered: true } : c)
        }));

        if (fbDb) {
          const sessionId = getFirebaseSessionId();
          fbDb.ref("jeopardy_game").update({
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          }).catch(() => {});
          fbDb.ref(`sessions/${sessionId}`).update({
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          }).catch(() => {});
          fbDb.ref(`sessions/${sessionId}/activeQuestion/state`).set('revealed').catch(() => {});
          fbDb.ref(`sessions/${sessionId}/activeTurn`).set(null).catch(() => {});
        }

        persistState({
          ...state,
          teams: updatedTeams,
          categories: nextCats,
          activeClue: { ...clue, state: 'revealed' },
          gameState: {
            ...(state.gameState || {}),
            status: "question_open",
            showAnswer: true,
            activeTurn: null
          },
          buzzerState: {
            ...b,
            isOpen: false,
            activeTurn: null,
            buzzedTeamId: null,
            buzzedPlayerName: null,
            answerTimeRemaining: 0,
            questionTimeRemaining: 0
          }
        });
      }

      // CIERRE DE SESIÓN GLOBAL Y REINICIO COMPLETO DEL TABLERO
      function executeGlobalLogout() {
        sound.playWrong();
        isAuthenticated = false;
        sessionStorage.clear();
        localStorage.removeItem(AUTH_KEY);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEGACY_STORAGE_KEY);
        localStorage.removeItem('jeopardy_player_name');
        localStorage.removeItem('jeopardy_player_team');
        localStorage.removeItem('jeopardy_player_id');
        localStorage.removeItem('jeopardy_player_registered');

        // Reinicio completo del estado global del tablero
        state = getDefaultState();
        state.status = 'setup';
        state.teams.forEach(t => {
          t.score = 0;
          t.members = [];
        });
        state.categories.forEach(cat => {
          cat.clues.forEach(cl => {
            cl.isAnswered = false;
            cl.answeredByTeamId = null;
          });
        });
        state.activeClue = null;
        state.buzzerState = {
          isOpen: false,
          buzzedTeamId: null,
          buzzedPlayerName: null,
          buzzedAt: null,
          answerTimeLimit: 10,
          answerTimeRemaining: 10,
          playerAnswer: null,
          lockedTeams: [],
          firstAttemptTeamId: null,
          hasReboundedToFirst: false,
          attemptedMembers: []
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(state));
          localStorage.setItem(SYNC_EVENT_KEY, JSON.stringify({ action: 'GLOBAL_LOGOUT', type: 'SESSION_TERMINATED', payload: {}, ts: Date.now() }));
        } catch (e) {}

        // Notificar cierre de sesión en Firebase Realtime Database
        if (fbDb) {
          const sessionId = getFirebaseSessionId();
          fbDb.ref(`sessions/${sessionId}/status`).set('closed').catch(err => console.warn('Firebase status closed error:', err));
        }

        if (ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({ type: 'GLOBAL_LOGOUT', action: 'GLOBAL_LOGOUT' }));
          } catch (e) {}
        }

        if (window.location.protocol.startsWith('http')) {
          fetch('/api/auth/logout', { method: 'POST' }).catch(() => {});
        }

        dispatchAction('GLOBAL_LOGOUT', { type: 'SESSION_TERMINATED' });
        render();
      }

      // Pantalla informativa para dispositivos móviles al cerrarse la sesión del anfitrión
      function renderPlayerSessionClosedScreen() {
        const app = document.getElementById('app');
        if (!app) return;
        sound.playWrong();
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A] text-center">
            <div class="w-full max-w-sm bg-[#000842] border-4 border-rose-500 rounded-3xl p-6 shadow-[0_0_50px_rgba(244,63,94,0.4)] space-y-4 animate-in zoom-in-95">

      // --- PARSERS DE PREGUNTAS (CSV Y JSON) ---
      function parseQuestionsCSV(csvText) {
        const firstLine = csvText.split('\n')[0] || '';
        const delimiter = firstLine.includes(';') ? ';' : ',';

        function parseCSVLine(text) {
          const parts = [];
          let cur = '';
          let inQuote = false;
          for (let i = 0; i < text.length; i++) {
            const c = text[i];
            if (c === '"') {
              if (inQuote && text[i + 1] === '"') {
                cur += '"';
                i++;
              } else {
                inQuote = !inQuote;
              }
            } else if (c === delimiter && !inQuote) {
              parts.push(cur.trim());
              cur = '';
            } else {
              cur += c;
            }
          }
          parts.push(cur.trim());
          return parts;
        }

        const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 2) throw new Error('El archivo CSV está vacío o contiene muy pocas filas.');

        const header = parseCSVLine(lines[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
        let catIdx = header.findIndex(h => h.includes('cat'));
        let valIdx = header.findIndex(h => h.includes('val') || h.includes('punt') || h.includes('point'));
        let qIdx = header.findIndex(h => h.includes('preg') || h.includes('quest') || h.includes('clue'));
        let ansIdx = header.findIndex(h => h.includes('resp') || h.includes('ans'));

        let startRow = 1;
        if (catIdx === -1 || qIdx === -1) {
          catIdx = 0; valIdx = 1; qIdx = 2; ansIdx = 3;
          startRow = 0;
        }

        const categoryMap = new Map();
        for (let i = startRow; i < lines.length; i++) {
          const cols = parseCSVLine(lines[i]);
          if (cols.length < 3) continue;
          const catName = cols[catIdx] || 'General';
          const rawVal = parseInt(cols[valIdx], 10);
          const question = cols[qIdx];
          const answer = cols[ansIdx] || 'Respuesta no provista';
          if (!question) continue;

          if (!categoryMap.has(catName)) {
            categoryMap.set(catName, []);
          }
          const catClues = categoryMap.get(catName);
          const value = !isNaN(rawVal) && rawVal > 0 ? rawVal : (catClues.length + 1) * 100;
          catClues.push({
            id: 'c' + (categoryMap.size) + '-' + value + '-' + (catClues.length + 1),
            value: value,
            question: question,
            answer: answer,
            isAnswered: false
          });
        }

        if (categoryMap.size === 0) {
          throw new Error('No se encontraron preguntas válidas en las filas del archivo CSV.');
        }

        const result = [];
        let catNum = 1;
        for (const [title, clues] of categoryMap.entries()) {
          if (result.length >= 6) break;
          clues.sort((a, b) => a.value - b.value);
          result.push({
            id: 'cat-' + catNum,
            title: title,
            clues: clues.slice(0, 5)
          });
          catNum++;
        }
        return result;
      }

          "Geografía,300,¿Qué cordillera montañosa recorre la costa occidental de Sudamérica?,Los Andes\n" +

          "Geografía,500,¿Cuál es el desierto no polar más seco del planeta?,Desierto de Atacama\n";

        const blob = new Blob([sample], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'plantilla_preguntas_jeopardy.csv';
        document.body.appendChild(a);

        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        const cat = state.categories.find(c => c.id === catId);
        let q = question;
        if (!q || typeof q === 'string') {
          q = cat ? cat.clues.find(cl => cl.id === (question || catId)) : null;
        }
        if (!q || q.isAnswered) return;

        sound.playClueOpen();
        const newQuestionCycleId = Date.now();
        const newQuestionId = q.id;

        const currentQuestionObj = {
          id: q.id,
          text: q.text || q.question || "",
          answer: q.answer || "",
          value: Number(q.value) || 100,
          catId: catId
        };

        const gameUpdate = {
          status: "question_open",
          currentQuestion: currentQuestionObj,
          buzzQueue: null,
          attemptedPlayerIds: null,
          activeTurn: null,
          showAnswer: false
        };

        state.gameState = gameUpdate;

        if (fbDb) {
          const db = fbDb;
          db.ref("jeopardy_game").update({
            status: "question_open",
            currentQuestion: {
              id: q.id,
              text: q.text || q.question || "",
              answer: q.answer || "",
              value: Number(q.value) || 100,
              catId: catId
            },
            buzzQueue: null,
            attemptedPlayerIds: null,
            activeTurn: null,
            showAnswer: false
          }).catch(() => {});

          const sessionId = getFirebaseSessionId();
          if (sessionId) {
            db.ref(`sessions/${sessionId}`).update(gameUpdate).catch(() => {});
            db.ref(`sessions/${sessionId}/buzzQueue`).set(null).catch(() => {});
            db.ref(`sessions/${sessionId}/attemptedPlayerIds`).set(null).catch(() => {});
            db.ref(`sessions/${sessionId}/activeTurn`).set(null).catch(() => {});
            db.ref(`sessions/${sessionId}/buzzers`).set(null).catch(() => {});
            db.ref(`sessions/${sessionId}/activeQuestion`).set({
              questionCycleId: newQuestionCycleId,
              questionId: newQuestionId,
              categoryId: cat?.id || catId,
              categoryTitle: cat?.title || 'Pista',
              value: Number(q.value) || 100,
              question: q.text || q.question || "",
              answer: q.answer || "",
              state: 'buzzing_open',
              timestamp: newQuestionCycleId

        };

        persistState(state);

        // Ajustes manuales de puntuación
        document.querySelectorAll('.btn-score-adjust').forEach(btn => {
          btn.addEventListener('click', () => {

      // MODAL DE PISTA ACTIVA CON CUENTA REGRESIVA DE 10 SEGUNDOS Y CONTROLES DEL PRESENTADOR
      function renderClueModalHTML() {
        const gs = state.gameState || {};
        const q = gs.currentQuestion || {};
        const cat = state.categories.find(c => c.id === (state.activeClue?.categoryId || q.catId));
        const clue = {
          id: q.id || state.activeClue?.id,
          question: q.text || q.question || state.activeClue?.question || '',
          answer: q.answer || state.activeClue?.answer || '',
          value: q.value || state.activeClue?.value || 100,
          categoryTitle: cat?.title || state.activeClue?.categoryTitle || 'Pista',
          state: gs.showAnswer ? 'revealed' : (state.activeClue?.state || (gs.activeTurn ? 'buzzed' : 'buzzing_open'))
        };
        const b = state.buzzerState || {};
        const activeTurn = b.activeTurn;
        const currentTeamId = activeTurn?.teamId || b.buzzedTeamId;
        const buzzedTeam = state.teams.find(t => t.id === currentTeamId);
        const currentPlayerName = activeTurn?.playerName || b.buzzedPlayerName;

        const allBuzzers = Object.values(b.buzzQueue || b.buzzers || {})
          .filter(item => item && item.playerId)
          .sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));
        const attemptedIds = normalizeAttemptedPlayerIds(b.attemptedPlayerIds || b.answeredPlayersHistory);
        const answeredSet = new Set(attemptedIds);
        const waitingBuzzers = allBuzzers.filter(item => item.playerId !== activeTurn?.playerId && !answeredSet.has(item.playerId));

        return `
          <div class="fixed inset-0 z-40 flex items-center justify-center p-3 sm:p-6 bg-black/90 backdrop-blur-md transition-all duration-300">
            <div class="w-full max-w-4xl bg-gradient-to-b from-[#000847] via-[#000329] to-[#000117] neon-gold-border rounded-3xl p-5 sm:p-8 flex flex-col justify-between min-h-[460px] max-h-[92vh] overflow-y-auto animate-clue-zoom shadow-[0_0_80px_rgba(255,204,0,0.5)]">
              <div class="flex items-center justify-between border-b-2 border-blue-900/60 pb-3">
                <span class="font-cinzel text-sm sm:text-base font-black text-[#FFCC00] uppercase tracking-wider">
                  ${clue.categoryTitle || 'Pista'} • $${clue.value}
                </span>
                <button
                  id="btn-close-modal-x"
                  type="button"
                  class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-black text-sm flex items-center justify-center cursor-pointer transition-colors"
                  title="Cerrar"
                >✕</button>
              </div>

              <div class="my-6 sm:my-8 text-center px-4">
                <h2 class="text-xl sm:text-3xl md:text-4xl font-black text-white font-cinzel tracking-wide leading-relaxed drop-shadow-md">
                  "${clue.question}"
                </h2>

                ${clue.state === 'revealed' ? `
                  <div class="mt-6 p-4 sm:p-5 rounded-2xl bg-emerald-950/90 border-3 border-emerald-400 text-center shadow-[0_0_30px_rgba(16,185,129,0.3)] animate-in zoom-in-95">
                    <span class="text-xs font-black uppercase tracking-wider text-emerald-300 block mb-1">
                      Respuesta Correcta
                    </span>
                    <span class="text-xl sm:text-3xl font-black text-white font-cinzel">
                      ${clue.answer}
                    </span>
                  </div>
                ` : ''}
              </div>

              <div class="space-y-4">
                ${clue.state === 'buzzing_open' ? `
                  <div class="p-4 rounded-2xl bg-[#060CE9]/40 border-2 border-[#FFCC00] text-center space-y-3 shadow-lg">
                    <div class="flex items-center justify-between text-xs font-black uppercase text-amber-300">
                      <span class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                        Tiempo para pulsar el botón:
                      </span>
                      <span id="question-timer-badge" class="font-mono text-base font-black px-3 py-1 rounded-xl bg-amber-500 text-black shadow">

                      </span>

                    <div class="w-full bg-blue-950 h-3 rounded-full overflow-hidden border border-blue-800">
                      <div

                        class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 transition-all duration-1000 ease-linear rounded-full"
                        style="width: ${((b.questionTimeRemaining ?? 10) / 10) * 100}%;"
                      ></div>
                    </div>

                    <p class="text-[11px] text-blue-200">
