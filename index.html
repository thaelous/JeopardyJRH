    // --- SINTETIZADOR DE AUDIO NATIVO (Web Audio API) ---
    class WebAudioSynthesizer {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSelect() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.1);
      }
      playClueOpen() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [293.66, 369.99, 440.00, 587.33, 880.00];
        notes.forEach((freq, idx) => {
          const st = now + idx * 0.055;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = idx === notes.length - 1 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, st);
          gain.gain.setValueAtTime(0.25, st);
          gain.gain.exponentialRampToValueAtTime(0.001, st + 0.35);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(st); osc.stop(st + 0.36);
        });
      }
      playBuzz() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [293.66, 369.99, 440.00, 587.33].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.42);
        });
      }
      playCorrect() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const st = now + idx * 0.08;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, st);
          gain.gain.setValueAtTime(0.24, st);
          gain.gain.exponentialRampToValueAtTime(0.001, st + 0.45);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(st); osc.stop(st + 0.46);
        });
      }
      playWrong() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [130.81, 123.47, 92.5].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.52);
        });
      }
      playTick() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1200, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.03);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(now); osc.stop(now + 0.045);
      }
      playTimeUp() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [110, 87.3].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.72);
        });
      }
    }

    const sound = new WebAudioSynthesizer();

    // Helper de QR Code con limpieza
    function QRCodeRenderer({ text, size = 320 }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || typeof QRCode === 'undefined') return;
        containerRef.current.innerHTML = '';
        try {
          new QRCode(containerRef.current, {
            text: text,
            width: size,
            height: size,
            colorDark: '#000533',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });
        } catch (e) {
          console.error('Error generando QRCode:', e);
        }
      }, [text, size]);

      return <div ref={containerRef} className="flex items-center justify-center"></div>;
    }

    // ==========================================
    // COMPONENTE PRINCIPAL: APP
    // ==========================================
    function App() {
      // Detección de Rol desde Parámetros URL (?role=player&team=team-1)
      const urlParams = useMemo(() => new URLSearchParams(window.location.search), []);
      const isPlayerParam = urlParams.get('role') === 'player';
      const initialTeamParam = urlParams.get('team') || 'team-1';

      // Estados de Autenticación y Navegación
      const [isHostAuth, setIsHostAuth] = useState(() => {
        return sessionStorage.getItem('jeopardy_auth_altair') === 'true';
      });
      const [currentView, setCurrentView] = useState(() => {
        if (isPlayerParam) return 'player';
        return sessionStorage.getItem('jeopardy_auth_altair') === 'true' ? 'playing' : 'login';
      });

      // Estados del Juego
      const [title, setTitle] = useState('Jeopardy Live Show');
      const [teamCount, setTeamCount] = useState(3);
      const [teams, setTeams] = useState(DEFAULT_TEAMS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);

      // Sincronización en Tiempo Real de Participantes por Equipo
      const [playersByTeam, setPlayersByTeam] = useState({});

      // Estados de Pregunta Activa y Turnos
      const [activeClue, setActiveClue] = useState(null);
      const [clueStatus, setClueStatus] = useState('idle'); // 'idle' | 'open' | 'answered'
      const [buzzerQueue, setBuzzerQueue] = useState([]);
      const [lockedTeams, setLockedTeams] = useState([]);
      const [activeTurn, setActiveTurn] = useState(null);
      
      // Temporizadores (10s pregunta, 10s respuesta)
      const [questionTimer, setQuestionTimer] = useState(10);
      const [answerTimer, setAnswerTimer] = useState(10);

      // Estado del Concursante Móvil
      const [playerRegistered, setPlayerRegistered] = useState(false);
      const [playerName, setPlayerName] = useState('');
      const [playerTeamId, setPlayerTeamId] = useState(initialTeamParam);
      const [playerId] = useState(() => 'p_' + Math.random().toString(36).substring(2, 9));
      const [hasBuzzed, setHasBuzzed] = useState(false);

      // Proyección QR en pantalla completa
      const [projectedTeamIdx, setProjectedTeamIdx] = useState(0);

      // Referencias para Temporizadores
      const questionTimerRef = useRef(null);
      const answerTimerRef = useRef(null);

      // URL base limpia para enlaces y códigos QR
      const baseUrl = useMemo(() => window.location.href.split('?')[0], []);

      // ----------------------------------------------------
      // SINCRONIZACIÓN CON FIREBASE Y BROADCAST CHANNEL
      // ----------------------------------------------------
      useEffect(() => {
        // 1. Cargar estado local previo si existe
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data.teams) setTeams(data.teams);
            if (data.categories) setCategories(data.categories);
            if (data.teamCount) setTeamCount(data.teamCount);
            if (data.title) setTitle(data.title);
          } catch (e) {
            console.warn('Error leyendo storage local:', e);
          }
        }

        // 2. Firebase Listener: Participantes
        if (fbDb) {
          const playersRef = fbDb.ref(`sessions/${SESSION_ID}/players`);
          playersRef.on('value', snapshot => {
            const val = snapshot.val() || {};
            setPlayersByTeam(val);
          });

          // Listener de Estado Global de Pregunta y Timbre
          const gameStateRef = fbDb.ref(`sessions/${SESSION_ID}/gameState`);
          gameStateRef.on('value', snapshot => {
            const stateVal = snapshot.val();
            if (stateVal) {
              if (stateVal.activeClue !== undefined) setActiveClue(stateVal.activeClue);
              if (stateVal.clueStatus !== undefined) setClueStatus(stateVal.clueStatus);
              if (stateVal.buzzerQueue !== undefined) setBuzzerQueue(stateVal.buzzerQueue || []);
              if (stateVal.lockedTeams !== undefined) setLockedTeams(stateVal.lockedTeams || []);
              if (stateVal.activeTurn !== undefined) setActiveTurn(stateVal.activeTurn);
              if (stateVal.questionTimer !== undefined) setQuestionTimer(stateVal.questionTimer);
              if (stateVal.answerTimer !== undefined) setAnswerTimer(stateVal.answerTimer);
            }
          });
        }

        // 3. Broadcast Channel Listener (Fallback local inmediato)
        if (broadcastChannel) {
          broadcastChannel.onmessage = event => {
            const { type, payload } = event.data || {};
            if (type === 'SYNC_GAME_STATE') {
              if (payload.activeClue !== undefined) setActiveClue(payload.activeClue);
              if (payload.clueStatus !== undefined) setClueStatus(payload.clueStatus);
              if (payload.buzzerQueue !== undefined) setBuzzerQueue(payload.buzzerQueue);
              if (payload.lockedTeams !== undefined) setLockedTeams(payload.lockedTeams);
              if (payload.activeTurn !== undefined) setActiveTurn(payload.activeTurn);
              if (payload.questionTimer !== undefined) setQuestionTimer(payload.questionTimer);
              if (payload.answerTimer !== undefined) setAnswerTimer(payload.answerTimer);
            } else if (type === 'BUZZER_PRESSED') {
              handleRegisterBuzzer(payload);
            } else if (type === 'PLAYER_JOINED') {
              setPlayersByTeam(prev => {
                const teamPlayers = prev[payload.teamId] || {};
                return {
                  ...prev,
                  [payload.teamId]: {
                    ...teamPlayers,
                    [payload.playerId]: { name: payload.name, joinedAt: Date.now() }
                  }
                };
              });
            } else if (type === 'GLOBAL_RESET') {
              handleResetAllLocal();
            }
          };
        }

        return () => {
          if (fbDb) {
            fbDb.ref(`sessions/${SESSION_ID}/players`).off();
            fbDb.ref(`sessions/${SESSION_ID}/gameState`).off();
          }
        };
      }, []);

      // Broadcast Helper
      const broadcast = useCallback((type, payload) => {
        if (broadcastChannel) {
          try { broadcastChannel.postMessage({ type, payload }); } catch (e) {}
        }
        if (fbDb && type === 'SYNC_GAME_STATE') {
          fbDb.ref(`sessions/${SESSION_ID}/gameState`).update(payload);
        }
      }, []);

      // Guardar cambios del tablero en localStorage
      const persistLocalGame = useCallback((newTeams, newCats, newTitle, newCount) => {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          teams: newTeams,
          categories: newCats,
          title: newTitle,
          teamCount: newCount
        }));
      }, []);

      // ----------------------------------------------------
      // LÓGICA DE TEMPORIZADORES Y MECÁNICAS DE JEOPARDY
      // ----------------------------------------------------

      // Limpieza de timbres locales de jugador al cambiar de pregunta
      useEffect(() => {
        setHasBuzzed(false);
      }, [activeClue?.id]);

      // Temporizador de Pregunta (10s cuando los pulsadores están habilitados)
      useEffect(() => {
        clearInterval(questionTimerRef.current);

        if (activeClue && clueStatus === 'open' && !activeTurn) {
          questionTimerRef.current = setInterval(() => {
            setQuestionTimer(prev => {
              if (prev <= 1) {
                clearInterval(questionTimerRef.current);
                sound.playTimeUp();
                // 10s agotados sin timbrazo: Revelar respuesta automáticamente
                setClueStatus('answered');
                broadcast('SYNC_GAME_STATE', { clueStatus: 'answered', questionTimer: 0 });
                return 0;
              }
              if (prev <= 4) sound.playTick();
              broadcast('SYNC_GAME_STATE', { questionTimer: prev - 1 });
              return prev - 1;
            });
          }, 1000);
        }

        return () => clearInterval(questionTimerRef.current);
      }, [activeClue, clueStatus, activeTurn, broadcast]);

      // Temporizador de Respuesta (10s para el concursante con el turno activo)
      useEffect(() => {
        clearInterval(answerTimerRef.current);

        if (activeClue && activeTurn && clueStatus === 'open') {
          answerTimerRef.current = setInterval(() => {
            setAnswerTimer(prev => {
              if (prev <= 1) {
                clearInterval(answerTimerRef.current);
                sound.playWrong();
                // Tiempo agotado para responder: Falla automática
                handleAnswerResult(false);
                return 0;
              }
              if (prev <= 4) sound.playTick();
              broadcast('SYNC_GAME_STATE', { answerTimer: prev - 1 });
              return prev - 1;
            });
          }, 1000);
        }

        return () => clearInterval(answerTimerRef.current);
      }, [activeClue, activeTurn, clueStatus]);

      // ----------------------------------------------------
      // ACCIONES DEL JUEGO
      // ----------------------------------------------------

      // 1. Abrir Pregunta en el Tablero
      const handleOpenClue = (catId, clueId) => {
        sound.playClueOpen();
        const cat = categories.find(c => c.id === catId);
        const clue = cat ? cat.clues.find(cl => cl.id === clueId) : null;
        if (!clue || clue.isAnswered) return;

        const newActiveClue = {
          catId,
          clueId,
          categoryTitle: cat.title,
          value: clue.value,
          question: clue.question,
          answer: clue.answer
        };

        setActiveClue(newActiveClue);
        setClueStatus('open');
        setBuzzerQueue([]);
        setLockedTeams([]);
        setActiveTurn(null);
        setQuestionTimer(10);
        setAnswerTimer(10);

        broadcast('SYNC_GAME_STATE', {
          activeClue: newActiveClue,
          clueStatus: 'open',
          buzzerQueue: [],
          lockedTeams: [],
          activeTurn: null,
          questionTimer: 10,
          answerTimer: 10
        });
      };

      // 2. Registro de Pulsación del Buzzer (Cronológico y Seguro)
      const handleRegisterBuzzer = useCallback((buzzerData) => {
        setBuzzerQueue(prevQueue => {
          if (lockedTeams.includes(buzzerData.teamId)) return prevQueue;
          if (prevQueue.some(b => b.teamId === buzzerData.teamId)) return prevQueue;

          const updatedQueue = [...prevQueue, buzzerData];
          sound.playBuzz();

          if (!activeTurn) {
            setActiveTurn(buzzerData);
            setAnswerTimer(10);
            broadcast('SYNC_GAME_STATE', {
              buzzerQueue: updatedQueue,
              activeTurn: buzzerData,
              answerTimer: 10
            });
          } else {
            broadcast('SYNC_GAME_STATE', { buzzerQueue: updatedQueue });
          }

          return updatedQueue;
        });
      }, [lockedTeams, activeTurn, broadcast]);

      // 3. Pulsar Timbre desde Móvil
      const handlePressPlayerBuzzer = () => {
        if (!activeClue || clueStatus !== 'open' || lockedTeams.includes(playerTeamId) || hasBuzzed) return;
        
        if (navigator.vibrate) navigator.vibrate([80]);
        sound.playBuzz();
        setHasBuzzed(true);

        const currentTeam = teams.find(t => t.id === playerTeamId);
        const buzzerEntry = {
          teamId: playerTeamId,
          teamName: currentTeam ? currentTeam.name : 'Equipo',
          teamColor: currentTeam ? currentTeam.color : '#2563EB',
          playerId,
          playerName: playerName || 'Concursante',
          timestamp: Date.now()
        };

        if (broadcastChannel) {
          broadcastChannel.postMessage({ type: 'BUZZER_PRESSED', payload: buzzerEntry });
        }
        if (fbDb) {
          fbDb.ref(`sessions/${SESSION_ID}/buzzers`).push(buzzerEntry);
        }
        handleRegisterBuzzer(buzzerEntry);
      };

      // 4. Calificar Respuesta (Correcta o Incorrecta)
      const handleAnswerResult = (isCorrect) => {
        if (!activeTurn || !activeClue) return;

        const clueVal = activeClue.value;
        const currentTeamId = activeTurn.teamId;

        if (isCorrect) {
          sound.playCorrect();
          if (typeof confetti === 'function') {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }

          const updatedTeams = teams.map(t => {
            if (t.id === currentTeamId) return { ...t, score: t.score + clueVal };
            return t;
          });
          setTeams(updatedTeams);

          const updatedCats = categories.map(cat => ({
            ...cat,
            clues: cat.clues.map(c => c.id === activeClue.clueId ? { ...c, isAnswered: true } : c)
          }));
          setCategories(updatedCats);
          persistLocalGame(updatedTeams, updatedCats, title, teamCount);

          setClueStatus('answered');
          broadcast('SYNC_GAME_STATE', {
            clueStatus: 'answered',
            teams: updatedTeams,
            categories: updatedCats
          });

        } else {
          sound.playWrong();

          const updatedTeams = teams.map(t => {
            if (t.id === currentTeamId) return { ...t, score: t.score - clueVal };
            return t;
          });
          setTeams(updatedTeams);
          persistLocalGame(updatedTeams, categories, title, teamCount);

          const newLocked = [...lockedTeams, currentTeamId];
          setLockedTeams(newLocked);

          const remainingQueue = buzzerQueue.filter(b => b.teamId !== currentTeamId && !newLocked.includes(b.teamId));
          setBuzzerQueue(remainingQueue);

          const activeTeamsList = teams.slice(0, teamCount);
          const allTeamsFailed = activeTeamsList.every(t => newLocked.includes(t.id));

          if (allTeamsFailed) {
            setClueStatus('answered');
            setActiveTurn(null);
            broadcast('SYNC_GAME_STATE', {
              teams: updatedTeams,
              lockedTeams: newLocked,
              buzzerQueue: [],
              activeTurn: null,
              clueStatus: 'answered'
            });
          } else if (remainingQueue.length > 0) {
            const nextTurn = remainingQueue[0];
            setActiveTurn(nextTurn);
            setAnswerTimer(10);
            broadcast('SYNC_GAME_STATE', {
              teams: updatedTeams,
              lockedTeams: newLocked,
              buzzerQueue: remainingQueue,
              activeTurn: nextTurn,
              answerTimer: 10
            });
          } else {
            setActiveTurn(null);
            setQuestionTimer(10);
            broadcast('SYNC_GAME_STATE', {
              teams: updatedTeams,
              lockedTeams: newLocked,
              buzzerQueue: [],
              activeTurn: null,
              questionTimer: 10
            });
          }
        }
      };

      // 5. Botón: Revelar Respuesta de Inmediato
      const handleRevealAnswerNow = () => {
        sound.playSelect();
        setClueStatus('answered');
        broadcast('SYNC_GAME_STATE', { clueStatus: 'answered' });
      };

      // 6. Botón: Cerrar y Volver al Tablero
      const handleCloseAndReturnToBoard = () => {
        sound.playSelect();
        if (activeClue) {
          const updatedCats = categories.map(cat => ({
            ...cat,
            clues: cat.clues.map(c => c.id === activeClue.clueId ? { ...c, isAnswered: true } : c)
          }));
          setCategories(updatedCats);
          persistLocalGame(teams, updatedCats, title, teamCount);
        }

        setActiveClue(null);
        setClueStatus('idle');
        setBuzzerQueue([]);
        setLockedTeams([]);
        setActiveTurn(null);

        broadcast('SYNC_GAME_STATE', {
          activeClue: null,
          clueStatus: 'idle',
          buzzerQueue: [],
          lockedTeams: [],
          activeTurn: null
        });
      };

      // 7. Reiniciar Tablero Completo
      const handleResetBoard = () => {
        if (!window.confirm('¿Reiniciar todo el tablero? Las puntuaciones volverán a 0 y todas las preguntas se reactivarán.')) return;
        sound.playSelect();
        const resetTeams = teams.map(t => ({ ...t, score: 0 }));
        const resetCats = categories.map(cat => ({
          ...cat,
          clues: cat.clues.map(c => ({ ...c, isAnswered: false }))
        }));
        setTeams(resetTeams);
        setCategories(resetCats);
        setActiveClue(null);
        setClueStatus('idle');
        setBuzzerQueue([]);
        setLockedTeams([]);
        setActiveTurn(null);
        persistLocalGame(resetTeams, resetCats, title, teamCount);
        broadcast('SYNC_GAME_STATE', {
          teams: resetTeams,
          categories: resetCats,
          activeClue: null,
          clueStatus: 'idle'

      };

      // 8. Cierre de Sesión Global
      const handleGlobalLogout = () => {
        if (!window.confirm('¿Cerrar sesión global? Se desconectarán todos los pulsadores y volverás al login.')) return;
        sessionStorage.removeItem('jeopardy_auth_altair');

        setCurrentView('login');
        if (fbDb) {
          fbDb.ref(`sessions/${SESSION_ID}`).remove();

        broadcast('GLOBAL_RESET', {});
      };

      const handleResetAllLocal = () => {
        setActiveClue(null);
        setClueStatus('idle');
        setBuzzerQueue([]);
        setLockedTeams([]);
        setActiveTurn(null);
      };

      // Registro de Concursante Móvil
      const handleJoinPlayer = (e) => {
        e.preventDefault();
        if (!playerName.trim()) return;
        sound.playSelect();
        setPlayerRegistered(true);

        const newPlayer = { name: playerName.trim(), joinedAt: Date.now() };

      };

      const getTeamMembersList = (teamId) => {
        const teamObj = playersByTeam[teamId] || {};
        return Object.entries(teamObj).map(([id, p]) => ({ id, name: p.name || 'Concursante' }));
      };

      // ==========================================
      // VISTA: PANTALLA DE LOGIN (Presentador)
      // ==========================================
      if (currentView === 'login') {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A]">
            <div className="w-full max-w-md bg-[#000842] border-4 border-[#D4AF37] rounded-3xl p-6 sm:p-8 shadow-[0_0_50px_rgba(212,175,55,0.3)] text-center space-y-6 animate-in zoom-in-95">
              <div className="w-20 h-20 mx-auto rounded-2xl bg-[#060CE9] border-3 border-[#FFCC00] flex items-center justify-center font-cinzel text-4xl font-black text-[#FFCC00] shadow-xl">
                J!
              </div>

              <div>
                <h1 className="text-2xl sm:text-3xl font-black uppercase text-white font-cinzel tracking-wider">
                  Jeopardy Live Show

      // ==========================================
      // VISTA: CONCURSANTE MÓVIL (Pulsador TV)
      // ==========================================
      if (currentView === 'player' || isPlayerParam) {

        const isMyTeamLocked = lockedTeams.includes(playerTeamId);

        return (
          <div className="min-h-screen flex flex-col justify-between p-4 bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A]">

            <header className="flex items-center justify-between bg-[#00021A] border-2 border-[#D4AF37] rounded-2xl p-3 shadow-lg">

                <div className="w-8 h-8 rounded-lg bg-[#060CE9] border border-[#FFCC00] flex items-center justify-center font-cinzel text-sm font-black text-[#FFCC00]">
                  J!
                </div>
                <div>
                  <h2 className="text-xs font-black uppercase text-white font-cinzel leading-none">
                    Pulsador Móvil
                  </h2>
                  <span className="text-[10px] text-blue-300 font-mono">
                    Sala: <strong className="text-[#FFCC00]">{ROOM_CODE}</strong>
                  </span>
                </div>
              </div>

              {playerRegistered && (
                <div className="flex items-center gap-1.5 px-3 py-1 rounded-full border border-white/20 text-xs font-bold" style={{ backgroundColor: myTeam.color }}>
                  <span className="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                  <span className="truncate max-w-[120px]">{playerName}</span>
                </div>
              )}
            </header>

            {/* Formulario de Registro si aún no ingresó */}
            {!playerRegistered ? (
              <main className="my-auto w-full max-w-sm mx-auto bg-[#000842] border-3 border-blue-800 rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <div className="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center text-white text-2xl font-black shadow-lg" style={{ backgroundColor: myTeam.color }}>
                  📱
                </div>
                <h3 className="text-xl font-black uppercase text-white font-cinzel">
                  Únete al Concurso
                </h3>
                <p className="text-xs text-blue-200">
                  Ingresa tu nombre para representar a tu equipo con tu celular.
                </p>

                <form onSubmit={handleJoinPlayer} className="space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-bold uppercase text-blue-300 mb-1">
                      Nombre o Apodo
                    </label>
                    <input
                      type="text"
                      required
                      value={playerName}
                      onChange={e => setPlayerName(e.target.value)}
                      placeholder="Ej: Sofía, Carlos..."
                      className="w-full px-4 py-3 bg-[#00021A] border-2 border-blue-900 rounded-xl text-white font-bold placeholder:text-blue-600 focus:outline-none focus:border-[#FFCC00] text-center"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-blue-300 mb-1">
                      Equipo Asignado
                    </label>
                    <select
                      value={playerTeamId}
                      onChange={e => setPlayerTeamId(e.target.value)}
                      className="w-full px-4 py-3 bg-[#00021A] border-2 border-blue-900 rounded-xl text-white font-bold text-center"
                    >
                      {teams.slice(0, teamCount).map(t => (
                        <option key={t.id} value={t.id}>{t.name}</option>
                      ))}
                    </select>
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3.5 rounded-xl text-white font-black text-xs uppercase tracking-widest shadow-xl transition-transform active:scale-95 cursor-pointer"
                    style={{ backgroundColor: myTeam.color }}
                  >
                    ¡Entrar al Pulsador! 🔔
                  </button>
                </form>
              </main>
            ) : (

              <main className="my-auto flex flex-col items-center justify-center text-center px-2 py-4">
                {/* Estado Actual */}
                <div className="mb-4">
                  <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider text-white mb-2 shadow" style={{ backgroundColor: myTeam.color }}>
                    <span>{myTeam.name}</span>
                    <span>•</span>
                    <span>Puntaje: ${myTeam.score}</span>
                  </div>

                  {!activeClue ? (
                    <div className="p-4 bg-[#000842] border border-blue-900 rounded-2xl max-w-xs mx-auto">
                      <p className="text-sm font-bold text-blue-200">

                      </p>

                    </div>
                  ) : isMyTeamLocked ? (
                    <div className="p-4 bg-rose-950/80 border-2 border-rose-500 rounded-2xl max-w-xs mx-auto text-rose-200">

                      <span className="text-xs">Tu equipo falló esta pista y no puede volver a timbrar.</span>
                    </div>
                  ) : isMyTurn ? (
                    <div className="p-4 bg-amber-500/20 border-3 border-[#FFCC00] rounded-2xl max-w-xs mx-auto animate-bounce">
                      <span className="text-3xl block mb-1">🏆</span>
                      <strong className="text-lg uppercase text-[#FFCC00] font-cinzel block">¡Tienes el Turno!</strong>
                      <span className="text-xs text-white font-bold">¡Responde en voz alta ahora! ({answerTimer}s)</span>
                    </div>
                  ) : hasBuzzed ? (
                    <div className="p-4 bg-blue-900/80 border-2 border-blue-400 rounded-2xl max-w-xs mx-auto">
                      <span className="text-2xl block mb-1">⚡</span>
                      <strong className="text-sm uppercase text-blue-200 block">¡Timbre Enviado!</strong>
                      <span className="text-xs text-blue-300">En cola de espera...</span>
                    </div>
                  ) : (
                    <div className="p-3 bg-[#060CE9]/40 border-2 border-[#FFCC00] rounded-2xl max-w-xs mx-auto">
                      <span className="text-xs uppercase text-[#FFCC00] font-black tracking-widest block">
                        ¡PREGUNTA ACTIVA POR ${activeClue.value}!
                      </span>
                      <span className="text-[11px] text-blue-200 font-mono">
                        Tiempo: {questionTimer}s
                      </span>
                    </div>
                  )}
                </div>

                {/* BOTÓN GIGANTE DEL PULSADOR 3D */}
                <div className="relative my-4">
                  {canBuzz && (
                    <div className="absolute -inset-4 rounded-full bg-[#FFCC00]/30 animate-pulse-ring pointer-events-none"></div>
                  )}

                  <button
                    type="button"
                    disabled={!canBuzz}
                    onClick={handlePressPlayerBuzzer}
                    className={`buzzer-btn-3d w-56 h-56 sm:w-64 sm:h-64 rounded-full flex flex-col items-center justify-center font-black uppercase transition-all ${
                      canBuzz
                        ? 'bg-gradient-to-b from-rose-500 via-rose-600 to-rose-800 text-white shadow-[0_18px_0_#881337,0_25px_40px_rgba(225,29,72,0.6)] cursor-pointer hover:brightness-110 active:translate-y-3 active:shadow-[0_4px_0_#881337]'
                        : 'bg-gradient-to-b from-slate-700 to-slate-900 text-slate-400 opacity-60 shadow-[0_8px_0_#0f172a] cursor-not-allowed'
                    }`}
                  >
                    <span className="text-4xl sm:text-5xl mb-1">🔔</span>
                    <span className="text-2xl sm:text-3xl font-cinzel tracking-wider">
                      {canBuzz ? '¡PULSAR!' : 'ESPERA'}
                    </span>
                    <span className="text-[11px] font-sans opacity-80 mt-1">
                      {canBuzz ? 'Toca para pedir turno' : 'Pulsador inactivo'}
                    </span>
                  </button>
                </div>
              </main>
            )}

            <footer className="text-center py-2 text-[10px] text-blue-400 border-t border-blue-950">
              Jeopardy Live Show • Sistema de Concurso Sincronizado
            </footer>
          </div>
        );
      }

      // ==========================================
      // VISTA: PROYECCIÓN QR EN PANTALLA COMPLETA
      // ==========================================
      if (currentView === 'qrcodes') {
        const activeTeams = teams.slice(0, teamCount);
        const currentProjectedTeam = activeTeams[projectedTeamIdx] || activeTeams[0];
        const teamMembers = getTeamMembersList(currentProjectedTeam.id);
        const qrUrl = `${baseUrl}?role=player&room=${ROOM_CODE}&team=${currentProjectedTeam.id}`;

        return (
          <div className="min-h-screen flex flex-col justify-between bg-[#000533] p-3 sm:p-5">

                  J!
                </div>
                <div>
                  <h1 className="text-base sm:text-lg font-black text-white uppercase font-cinzel leading-none">
                    {title}
                  </h1>

                <button

                </button>

                  Cerrar Sesión Global
                </button>
              </div>
            </header>

            {/* Contenedor Centrado de Proyección en Pantalla Completa (max-w-3xl) */}
            <main className="w-full max-w-2xl lg:max-w-3xl mx-auto my-auto py-2 sm:py-4 flex flex-col items-center justify-center">
              <div
                className="w-full bg-gradient-to-b from-[#000847] via-[#000329] to-[#000117] border-4 rounded-3xl p-5 sm:p-8 shadow-[0_0_70px_rgba(0,0,0,0.9),0_0_30px_rgba(212,175,55,0.25)] flex flex-col items-center text-center transition-all"
                style={{ borderColor: currentProjectedTeam.color }}
              >
                {/* Selector de Equipo Proyectado */}
                <div className="w-full pb-4 sm:pb-6 border-b border-blue-900/60 flex flex-col items-center gap-3">
                  <div className="flex items-center justify-between w-full px-1">
                    <span className="text-xs sm:text-sm font-black uppercase tracking-widest text-blue-300">
                      Seleccionar Equipo para Proyectar:
                    </span>

                      className="px-3 py-2.5 sm:px-4 sm:py-3 rounded-2xl bg-blue-950/90 hover:bg-blue-900 border-2 border-blue-600 text-white font-black text-sm sm:text-base flex items-center gap-1 cursor-pointer shadow active:scale-95"

                          <button
                            type="button"
                            onClick={() => handleAnswerResult(false)}
                            className="flex-1 py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider border border-rose-400 cursor-pointer shadow-lg active:scale-95"
                          >
                            ✗ Incorrecto (-${activeClue.value})
                          </button>
                        </div>
                      </div>
                    )}

                    {/* Cola de Timbre si hay más equipos en espera */}
                    {buzzerQueue.length > 1 && (
                      <div className="text-xs text-blue-300">
                        Siguientes en cola: {buzzerQueue.slice(1).map(b => b.teamName).join(', ')}
                      </div>
                    )}
                  </div>
                )}

                {/* BOTONES DE CONTROL DEL PRESENTADOR */}
                <div className="pt-4 border-t border-blue-900/80 flex flex-wrap items-center justify-between gap-3">
                  {clueStatus === 'open' ? (
                    <button
                      type="button"
                      onClick={handleRevealAnswerNow}
                      className="px-5 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-black text-xs uppercase tracking-wider border border-amber-400 cursor-pointer shadow"
                    >
                      Cerrar / Revelar Respuesta
                    </button>
                  ) : (
                    <div></div>
                  )}

                  <button
                    type="button"
                    onClick={handleCloseAndReturnToBoard}
                    className="px-6 py-2.5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-black text-xs uppercase tracking-wider border border-blue-600 cursor-pointer shadow ml-auto"
                  >
                    Cerrar / Volver al Tablero →
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // --- MONTAJE SEGURO Y COMPROBACIÓN CONTRA PANTALLA BLANCA ---
    try {
      const rootElement = document.getElementById("root");
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    } catch (err) {
      console.error("Error crítico al montar la aplicación:", err);
      const rootElement = document.getElementById("root");
      if (rootElement) {
        rootElement.innerHTML = `
          <div style="padding:24px;text-align:center;color:#FFCC00;font-family:sans-serif;">
            <h2>Error al iniciar Jeopardy Live Show</h2>
            <p style="color:#fff;">${err && err.message ? err.message : String(err)}</p>
            <button onclick="location.reload();" style="padding:10px 20px;margin-top:10px;font-weight:bold;cursor:pointer;">Recargar</button>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
