                    </p>

                    ${waitingBuzzers.length > 0 ? `
                      <div class="p-2.5 rounded-xl bg-blue-900/60 border border-blue-500 text-xs text-blue-200 flex flex-wrap gap-2 items-center justify-center">
                        <span class="font-black text-amber-300">Cola de espera (${waitingBuzzers.length}):</span>
                        ${waitingBuzzers.map((q, idx) => `
                          <span class="px-2 py-0.5 rounded bg-blue-950 text-white border border-blue-400 font-mono text-[11px]">
                            ${idx + 1}º ${state.teams.find(t=>t.id===q.teamId)?.name || q.teamId} (${q.playerName})
                          </span>
                        `).join('')}
                      </div>
                    ` : ''}

                    ${answeredSet.size > 0 ? `
                      <div class="text-xs text-rose-300 bg-rose-950/40 p-2 rounded-xl border border-rose-800">
                        Participantes que fallaron en esta pregunta: <strong class="text-rose-400">${answeredSet.size}</strong>
                      </div>
                    ` : ''}

                    <!-- Botón del presentador para cerrar y revelar inmediatamente -->
                    <div class="pt-2 flex justify-end">
                      <button
                        id="btn-close-reveal-answer"
                        type="button"
                        class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-wider border-2 border-amber-300 cursor-pointer shadow-lg transition-all flex items-center justify-center gap-2"
                      >
                        <span>👁️</span>
                        <span>Cerrar / Revelar Respuesta</span>
                      </button>
                    </div>
                  </div>
                ` : ''}

                ${clue.state === 'buzzed' && buzzedTeam ? `
                  <div
                    class="p-4 sm:p-5 rounded-2xl border-4 text-center space-y-3 shadow-xl"
                    style="background-color: ${buzzedTeam.color}22; border-color: ${buzzedTeam.color};"
                  >
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-black uppercase tracking-wider text-white">
                        Turno Otorgado:
                      </span>
                      <span
                        class="px-3 py-1 rounded-xl text-xs sm:text-sm font-black text-white uppercase tracking-wider shadow"
                        style="background-color: ${buzzedTeam.color};"
                      >
                        ${buzzedTeam.name}
                      </span>
                    </div>

                    <div class="text-lg sm:text-xl font-black text-white">
                      Participante: <strong class="text-[#FFCC00]">${currentPlayerName || 'Pulsador Móvil'}</strong>
                    </div>

                    ${b.playerAnswer ? `
                      <div class="p-3 rounded-xl bg-emerald-500/20 border-2 border-emerald-400 text-emerald-200 text-xs font-bold space-y-1">
                        <span class="text-[10px] uppercase tracking-wider text-emerald-400 block font-black">Respuesta escrita recibida:</span>
                        <span class="text-white text-base sm:text-lg font-black block">"${b.playerAnswer}"</span>
                      </div>
                    ` : `
                      <div class="p-3 rounded-xl bg-amber-500/20 border-2 border-amber-400 text-center space-y-2">
                        <div class="flex items-center justify-between text-xs font-black uppercase text-amber-300">
                          <span>Tiempo límite para responder:</span>
                          <span id="player-timer-badge" class="font-mono text-base font-black px-2.5 py-0.5 rounded bg-amber-500 text-black">
                            ${b.answerTimeRemaining ?? 10}s
                          </span>
                        </div>
                        <div class="w-full bg-amber-950 h-2.5 rounded-full overflow-hidden">
                          <div
                            id="player-timer-bar"
                            class="h-full bg-amber-400 transition-all duration-1000 ease-linear rounded-full"
                            style="width: ${((b.answerTimeRemaining ?? 10) / 10) * 100}%;"
                          ></div>
                        </div>
                        <p class="text-[11px] text-amber-200">
                          Si no responde a tiempo, el turno rebotará inmediatamente al siguiente participante en la cola.
                        </p>
                      </div>
                    `}

                    ${waitingBuzzers.length > 0 ? `
                      <div class="p-2 rounded-xl bg-blue-950/80 border border-blue-600 text-xs text-blue-200 flex flex-wrap items-center justify-center gap-1.5">
                        <span class="font-bold text-[#FFCC00]">En cola si este equipo falla:</span>
                        ${waitingBuzzers.map((q, idx) => `
                          <span class="px-2 py-0.5 rounded bg-blue-900 text-white font-mono text-[10px]">
                            ${idx + 1}º ${state.teams.find(t=>t.id===q.teamId)?.name || q.teamId} (${q.playerName})
                          </span>
                        `).join('')}
                      </div>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3 pt-2">
                      <button
                        id="btn-judge-correct"
                        type="button"
                        class="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow border border-emerald-300 cursor-pointer transition-all"
                      >
                        Respuesta Correcta (+${clue.value})
                      </button>
                      <button
                        id="btn-judge-wrong"
                        type="button"
                        class="py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow border border-rose-300 cursor-pointer transition-all"
                      >
                        Incorrecto / Siguiente en Cola (-${clue.value})
                      </button>
                    </div>

                    <!-- Botón del presentador para cerrar y revelar inmediatamente -->
                    <div class="pt-2 flex justify-end">
                      <button
                        id="btn-close-reveal-answer"
                        type="button"
                        class="w-full sm:w-auto px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider border border-amber-300 cursor-pointer shadow transition-all flex items-center justify-center gap-1.5"
                      >
                        <span>👁️</span>
                        <span>Cerrar / Revelar Respuesta</span>
                      </button>
                    </div>
                  </div>
                ` : ''}

                ${clue.state === 'revealed' ? `
                  <button
                    id="btn-close-back-to-board"
                    type="button"
                    class="w-full py-4 rounded-2xl bg-gradient-to-r from-[#D4AF37] via-[#FFCC00] to-[#D4AF37] hover:brightness-110 active:scale-98 text-[#000533] font-black text-sm sm:text-base uppercase tracking-widest shadow-[0_0_30px_rgba(255,204,0,0.5)] border-2 border-white cursor-pointer flex items-center justify-center gap-2 transition-all"
                  >
                    <span>✕</span>
                    <span>Cerrar / Volver al Tablero</span>
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }

      function attachClueModalEvents() {
        const btnJudgeCorrect = document.getElementById('btn-judge-correct');
        if (btnJudgeCorrect) {
          btnJudgeCorrect.addEventListener('click', () => {
            handleTeamCorrectAnswer();
          });
        }

        const btnJudgeWrong = document.getElementById('btn-judge-wrong');
        if (btnJudgeWrong) {
          btnJudgeWrong.addEventListener('click', () => {
            handleTeamFailedAnswer(state.buzzerState.activeTurn?.teamId || state.buzzerState.buzzedTeamId, false);
          });
        }

        // Botón "Cerrar / Revelar Respuesta" (presentador durante espera de respuesta o pulsadores)
        const btnCloseReveal = document.getElementById('btn-close-reveal-answer');
        if (btnCloseReveal) {
          btnCloseReveal.addEventListener('click', () => {
            sound.playSelect();
            if (questionTimerInterval) { clearInterval(questionTimerInterval); questionTimerInterval = null; }
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            const nextState = closeAndRevealClue(state);
            persistState(nextState);
          });
        }

        // Botón "Cerrar / Volver al Tablero" (en la vista de Respuesta Correcta)
        const btnCloseBack = document.getElementById('btn-close-back-to-board');
        const btnCloseX = document.getElementById('btn-close-modal-x');

        const returnToBoard = () => {
          sound.playSelect();
          if (questionTimerInterval) { clearInterval(questionTimerInterval); questionTimerInterval = null; }
          if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

          const resetPayload = {
            status: "board",
            currentQuestion: null,
            buzzQueue: null,
            attemptedPlayerIds: null,
            activeTurn: null,
            showAnswer: false
          };

          state.gameState = resetPayload;

          if (fbDb) {
            const sessionId = getFirebaseSessionId();
            fbDb.ref("jeopardy_game").update(resetPayload).catch(() => {});
            fbDb.ref(`sessions/${sessionId}`).update(resetPayload).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/activeQuestion`).set(null).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/buzzQueue`).set(null).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/attemptedPlayerIds`).set(null).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/activeTurn`).set(null).catch(() => {});
            fbDb.ref(`sessions/${sessionId}/buzzers`).set(null).catch(() => {});
          }

          const clue = state.activeClue;
          const nextCats = state.categories.map(cat => ({
            ...cat,
            clues: cat.clues.map(c => c.id === clue?.id ? { ...c, isAnswered: true } : c)
          }));
          state.categories = nextCats;
          state.activeClue = null;
          state.buzzerState = {
            isOpen: false,
            buzzQueue: {},
            attemptedPlayerIds: {},
            buzzers: {},
            activeTurn: null,
            buzzedTeamId: null,
            buzzedPlayerName: null,
            buzzedAt: null,
            questionTimeRemaining: 10,
            answerTimeLimit: 10,
            answerTimeRemaining: 10,
            playerAnswer: null,
            lockedTeams: []
          };
          persistState(state);
        };

        if (btnCloseBack) btnCloseBack.addEventListener('click', returnToBoard);
        if (btnCloseX) {
          btnCloseX.addEventListener('click', () => {
            if (state.activeClue && state.activeClue.state === 'revealed') {
              returnToBoard();
            } else {
              // Si aún no está revelada, dar la opción directa de cerrarla y revelarla
              sound.playSelect();
              if (questionTimerInterval) { clearInterval(questionTimerInterval); questionTimerInterval = null; }
              if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
              const nextState = closeAndRevealClue(state);
              persistState(nextState);
            }
          });
        }
      }

      // Estado reactivo local del jugador para pulsador móvil (reinicio automático por pregunta)
      let playerLocalAnswer = '';
      let playerLocalHasBuzzed = false;
      let playerLastQuestionId = null;

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // 4. VISTA MÓVIL DEL JUGADOR
      function renderPlayerView(container) {
        const teamCount = state.teamCount || state.teams.length;
        const availableTeams = state.teams.slice(0, teamCount);
        let myTeamId = assignedTeamId || localStorage.getItem('jeopardy_player_team') || availableTeams[0]?.id;
        let myName = localStorage.getItem('jeopardy_player_name') || '';
        const assignedTeam = availableTeams.find(t => t.id === assignedTeamId);

        // Caso 1: Participante no registrado aún
        if (!myName) {
          if (document.getElementById('player-join-form')) {
            return;
          }
          container.innerHTML = `
            <div class="min-h-screen bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A] p-4 flex items-center justify-center overflow-y-auto pb-16">
              <div class="w-full max-w-sm bg-[#000842] border-4 border-[#FFCC00] rounded-3xl p-6 text-center space-y-4 shadow-2xl animate-in zoom-in-95">
                <div class="w-16 h-16 mx-auto rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-3xl font-black text-[#FFCC00]">
                  J!
                </div>
                <div>
                  <h2 class="text-xl font-black text-white uppercase font-cinzel flex items-center justify-center gap-2">
                    Pulsador Móvil
                    <span class="w-2 h-2 rounded-full bg-emerald-400 sync-status-dot animate-pulse"></span>
                  </h2>
                  <p class="text-xs text-blue-200 mt-1">
                    Sala: <strong class="text-[#FFCC00] font-mono">${roomCodeParam || state.roomCode}</strong>
                  </p>
                </div>

                ${assignedTeam ? `
                  <div
                    class="p-3 rounded-2xl border-2 text-center shadow-inner"
                    style="background-color: ${assignedTeam.color}22; border-color: ${assignedTeam.color};"
                  >
                    <span class="text-[10px] font-black uppercase text-blue-200 block tracking-wider">
                      Equipo asignado por QR:
                    </span>
                    <span class="text-base font-black uppercase tracking-wider block mt-0.5" style="color: ${assignedTeam.color};">
                      ${assignedTeam.name}
                    </span>
                  </div>
                ` : ''}

                <form id="player-join-form" class="space-y-4 text-left">
                  <div>
                    <label class="block text-[11px] font-black uppercase tracking-wider text-blue-200 mb-1">
                      Selecciona o Confirma tu Equipo
                    </label>
                    <select
                      id="player-team-select"
                      class="w-full py-3 px-3 rounded-xl bg-[#000324] border-2 border-blue-500 text-white font-bold text-base outline-none focus:border-[#FFCC00]"
                      style="font-size: 16px !important;"
                    >
                      ${availableTeams.map(t => `
                        <option value="${t.id}" ${t.id === myTeamId ? 'selected' : ''}>
                          ${t.name} (${t.members.length} conectados)
                        </option>
                      `).join('')}
                    </select>
                  </div>

                  <div>
                    <label class="block text-[11px] font-black uppercase tracking-wider text-blue-200 mb-1">
                      Tu Nombre o Apodo
                    </label>
                    <input
                      id="player-name-input"
                      type="text"

          document.getElementById('player-join-form').addEventListener('submit', (e) => {
            e.preventDefault();
            sound.init();
            const chosenName = document.getElementById('player-name-input').value.trim();
            const chosenTeam = document.getElementById('player-team-select').value;
            if (!chosenName) return;

            const activeRoom = roomCodeParam || state.roomCode || 'JP-2025';
            const memberId = 'm-' + Date.now();

            localStorage.setItem('jeopardy_player_name', chosenName);
            localStorage.setItem('jeopardy_player_team', chosenTeam);
            localStorage.setItem('jeopardy_player_id', memberId);
            localStorage.setItem('jeopardy_player_room', activeRoom);
            localStorage.setItem('jeopardy_player_registered', 'true');

            // 1. Cargar el estado más reciente de localStorage para no sobreescribir datos del anfitrión
            let freshState = state;
            try {
              const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
              if (raw) freshState = JSON.parse(raw);
            } catch (err) {}

            // 2. Limpiar duplicados del participante en otros equipos
            freshState.teams = (freshState.teams || []).map(t => ({
              ...t,
              members: (t.members || []).filter(m => m.name.toLowerCase() !== chosenName.toLowerCase() && m.id !== memberId)
            }));

            // 3. Agregar el participante al equipo seleccionado (por ID o por nombre)
            let targetTeam = freshState.teams.find(t => 
              t.id === chosenTeam || 
              t.name.toLowerCase() === chosenTeam.toLowerCase() ||
              t.id.toLowerCase() === chosenTeam.toLowerCase()
            );
            if (!targetTeam && freshState.teams.length > 0) targetTeam = freshState.teams[0];
            if (targetTeam) {
              if (!targetTeam.members) targetTeam.members = [];
              targetTeam.members.push({
                id: memberId,
                name: chosenName,
                joinedAt: Date.now()
              });
            }
            freshState.lastUpdated = Date.now();
            state = freshState;

            // 4. Guardar sincrónicamente en la clave unificada de localStorage
            const joinPayload = {
              teamId: chosenTeam,
              playerName: chosenName,
              memberName: chosenName,
              sessionId: memberId,
              memberId: memberId,
              roomCode: activeRoom
            };

            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(freshState));
              localStorage.setItem(LEGACY_STORAGE_KEY, JSON.stringify(freshState));
              localStorage.setItem(SYNC_TRIGGER_KEY, JSON.stringify({
                action: 'PLAYER_JOIN',
                ...joinPayload,
                ts: Date.now()
              }));
              localStorage.setItem(SYNC_EVENT_KEY, JSON.stringify({
                action: 'PLAYER_JOIN',
                payload: joinPayload,
                ts: Date.now()
              }));
            } catch (err) {}

            // 5. Propagar inmediatamente a través de BroadcastChannel
            try {
              if (bc) {
                bc.postMessage({
                  action: 'PLAYER_JOIN',
                  payload: joinPayload,
                  state: freshState,
                  ts: Date.now()
                });
              }
            } catch (err) {}

            // 6. Notificación HTTP inmediata al backend REST /api/game/join
            if (window.location.protocol.startsWith('http')) {
              fetch('/api/game/join', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(joinPayload)
              })
              .then(res => res.json())
              .then(data => {
                if (data && data.state) {
                  applyServerState(data.state);
                }
              })
              .catch(() => {});
            }

            // 7. Sincronización en Firebase Realtime Database
            // Ruta estricta requerida: /sessions/{sessionId}/teams/{teamId}/players/{playerId}
            if (fbDb) {
              const sessionId = getFirebaseSessionId();
              const teamId = targetTeam ? targetTeam.id : chosenTeam;
              const teamColorKey = targetTeam ? getTeamColorKey(targetTeam) : null;
              const playerPayload = {
                name: chosenName,
                joinedAt: Date.now()
              };

              // Guardar bajo /teams/{teamId}/players/{playerId}
              fbDb.ref(`sessions/${sessionId}/teams/${teamId}/players/${memberId}`).set(playerPayload)
                .catch(err => console.warn('Firebase push player error:', err));

              // Compatibilidad adicional con clave de color si difiere del ID
              if (teamColorKey && teamColorKey !== teamId) {
                fbDb.ref(`sessions/${sessionId}/teams/${teamColorKey}/players/${memberId}`).set(playerPayload)
                  .catch(() => {});
              }
            }

            // 8. Notificar por WebSocket y WebRTC P2P
            dispatchAction('PLAYER_JOIN', joinPayload);

            sound.playJoin();
            render();
          });
          return;
        }

        // Caso 2: Participante ya registrado (Pantalla Activa del Pulsador Móvil)
        let myPlayerId = localStorage.getItem('jeopardy_player_id');
        if (!myPlayerId && myName) {
          myPlayerId = 'm-' + myName.replace(/\s+/g, '_');
          localStorage.setItem('jeopardy_player_id', myPlayerId);

        // Identificador del participante actual
        const playerId = myPlayerId;

        // Efecto reactivo (useEffect) que escucha el cambio de pregunta:
        // useEffect(() => { if (gameState?.currentQuestion?.id) { setHasBuzzed(false); } }, [gameState?.currentQuestion?.id]);
        if (gameState?.currentQuestion?.id) {

            playerLastQuestionId = gameState.currentQuestion.id;
            setHasBuzzed(false);
            playerLocalAnswer = '';

        } else {

          setHasBuzzed(false);

        const myTeam = state.teams.find(t => t.id === myTeamId) || state.teams[0];
        const b = state.buzzerState || {};

        // Turno Activo
        const activeTurn = gameState.activeTurn || b.activeTurn;
        const isMyTurn = !!(activeTurn && (activeTurn.playerId === playerId || (!activeTurn.playerId && activeTurn.teamId === myTeam.id)));
        const isMyTeamTurn = !!(activeTurn && activeTurn.teamId === myTeam.id);

        // Cola actual
        const currentQueueObj = gameState.buzzQueue || b.buzzQueue || b.buzzers || {};
        const currentQueueList = Object.values(currentQueueObj).filter(entry => entry && entry.playerId);
        const alreadyInQueue = currentQueueList.some(entry => entry.playerId === playerId);

        const hasBuzzed = Boolean(playerLocalHasBuzzed || alreadyInQueue);

        // Asegura que el atributo disabled del botón de timbrado dependa estrictamente de:
        const isButtonDisabled = Boolean(
          gameState?.status !== "question_open" ||
          gameState?.showAnswer ||
          hasBuzzed ||
          Boolean(gameState?.attemptedPlayerIds?.[playerId])
        );

        // Estados visuales auxiliares para ambientación
        const isQuestionOpen = (gameState?.status === "question_open");
        const isShowAnswer = Boolean(gameState?.showAnswer);
        const isAttempted = Boolean(gameState?.attemptedPlayerIds?.[playerId]);

        // Calcular posición en la cola
        const allBuzzersList = [...currentQueueList].sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));
        const waitingList = allBuzzersList.filter(item => item.playerId !== activeTurn?.playerId && !Boolean(gameState?.attemptedPlayerIds?.[item.playerId]));
        const queueIndex = waitingList.findIndex(item => item.playerId === playerId);
        const queuePos = queueIndex >= 0 ? queueIndex + 1 : 1;
        const isInQueue = hasBuzzed && !isMyTurn && !isAttempted;

        // 1. Asegurar contenedor estructural persistente (evita que se desmonte el layout)
        let mainContainer = document.getElementById('player-main-container');
        if (!mainContainer) {
          container.innerHTML = `

                    >

                <!-- Banner de Confirmación Visual Inmediata -->
                <div class="p-3 rounded-2xl bg-emerald-950/80 border-2 border-emerald-400 text-center shadow-lg">
                  <div class="flex items-center justify-center gap-1.5 text-emerald-400 font-black text-xs uppercase tracking-wider">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    ✓ ¡REGISTRADO EXITOSAMENTE!
                  </div>
                  <p class="text-xs font-bold text-white mt-0.5">
                    Enlazado a Sala: <strong class="text-[#FFCC00] font-mono">${roomCodeParam || state.roomCode}</strong> • Equipo: <strong id="player-banner-team-name" style="color: ${myTeam.color};">${myTeam.name}</strong>

          document.getElementById('btn-player-change-team')?.addEventListener('click', () => {
            const oldName = localStorage.getItem('jeopardy_player_name');
            const oldTeam = localStorage.getItem('jeopardy_player_team');
            localStorage.removeItem('jeopardy_player_name');
            localStorage.removeItem('jeopardy_player_team');

            if (oldName && oldTeam) {

        // Actualizar badges superiores en caso de cambio de equipo
        const badgeColor = document.getElementById('player-badge-color');

        const stage = document.getElementById('player-center-stage');

        // 2. Renderizado / Actualización granular del Área Central
        if (isMyTurn) {

            stage.innerHTML = `
              <div id="player-active-turn-card" class="bg-gradient-to-b from-white via-amber-50 to-amber-100 border-4 border-[#FFCC00] rounded-3xl p-5 shadow-[0_0_60px_rgba(16,185,129,0.7),0_0_30px_rgba(255,204,0,0.8)] space-y-3 text-blue-950 animate-clue-zoom animate-turn-won text-left" style="user-select: text; -webkit-user-select: text;">

                    <input

                      value="${escapeHtml(playerLocalAnswer)}"
                      class="w-full py-3.5 px-3.5 rounded-xl border-2 border-blue-950 font-bold text-base text-blue-950 outline-none focus:border-amber-500 bg-slate-50 transition-colors shadow-inner"
                      style="font-size: 16px !important; min-height: 48px; user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; touch-action: manipulation;"
                    />

                  <button
                    id="btn-submit-answer"

                    class="w-full py-3.5 rounded-xl bg-[#FFCC00] hover:bg-yellow-300 active:scale-98 text-[#000533] font-black text-xs uppercase tracking-wider shadow-lg cursor-pointer border-2 border-blue-950 transition-all flex items-center justify-center gap-1.5"
                    style="min-height: 48px; touch-action: manipulation;"
                  >
                    <span>Enviar Respuesta</span>
                    <span>➜</span>
                  </button>
                </form>
              </div>
            `;

            const input = document.getElementById('player-answer-input');
            const answerForm = document.getElementById('player-answer-form');

            if (input) {
              input.addEventListener('input', (e) => {
                playerLocalAnswer = e.target.value;
              });

              input.addEventListener('focus', () => {
                setTimeout(() => {
                  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 150);
              });

              setTimeout(() => {
                try { input.focus(); } catch (err) {}
              }, 50);
            }

            if (answerForm) {
              answerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const finalAnswer = (playerLocalAnswer || input?.value || '').trim();
                if (!finalAnswer) return;
                sound.playSelect();
                dispatchAction('PLAYER_ANSWER', {
                  teamId: myTeam.id,
                  playerId: myPlayerId,
                  playerName: myName,
                  answer: finalAnswer
                });
                playerLocalAnswer = '';
              });

          }
        } else if (isMyTeamTurn) {
          // --- SUB-CASO 2.3: UN COMPAÑERO DE TU EQUIPO TIENE EL TURNO ---
          playerLocalAnswer = '';
          const activePlayerName = activeTurn?.playerName || 'Tu compañero(a)';
          stage.innerHTML = `
            <div class="bg-[#000842] border-4 border-blue-400 rounded-3xl p-5 shadow-2xl space-y-3 text-white animate-in zoom-in-95">

              </h3>
              <p class="text-sm font-bold text-[#FFCC00]">

              </p>
              <div class="p-2.5 rounded-xl bg-blue-950/80 border border-blue-700 flex items-center justify-between text-xs">
                <span class="text-blue-300">Tiempo restante:</span>
                <span class="font-mono text-sm font-black px-2 py-0.5 rounded bg-amber-500 text-black">
                  ${b.answerTimeRemaining ?? 10}s
                </span>
              </div>
            </div>
          `;
        } else {
          // --- SUB-CASO 2.4: MODO PULSADOR (Available / In Queue / Locked / Waiting) ---
          playerLocalAnswer = '';

          let btnClass = 'bg-gradient-to-b from-blue-900 via-indigo-950 to-[#000424] border-4 border-blue-500 text-blue-300 shadow-[0_14px_0_#020617,inset_0_2px_6px_rgba(255,255,255,0.15)] cursor-not-allowed opacity-85';
          let iconText = '🔔';
          let labelText = 'PULSADOR LISTO';
          let subText = 'Esperando pregunta en el tablero...';
          let ringGlowClass = '';

          if (isAttempted) {
            btnClass = 'bg-gradient-to-b from-slate-800 via-slate-900 to-black border-4 border-slate-700 text-slate-500 shadow-[0_8px_0_#0a0f1d,inset_0_2px_8px_rgba(0,0,0,0.8)] cursor-not-allowed opacity-75';
            iconText = '🔒';
            labelText = 'BLOQUEADO';
            subText = 'Turno fallado para esta pregunta. Esperando siguiente pista...';
            ringGlowClass = '';
          } else if (isInQueue || hasBuzzed) {
            btnClass = 'bg-gradient-to-b from-amber-500 via-amber-600 to-amber-950 border-4 border-amber-300 text-white shadow-[0_16px_0_#582506,0_22px_40px_rgba(245,158,11,0.65),inset_0_4px_12px_rgba(255,255,255,0.4)] cursor-not-allowed animate-pulse';
            iconText = '⏳';
            labelText = '¡Pulsado! En espera';
            subText = `Puesto ${queuePos}º en la cola. Si el turno anterior falla, tu turno se activará automáticamente.`;
            ringGlowClass = 'ring-4 ring-amber-400/60 shadow-[0_0_25px_rgba(245,158,11,0.5)]';
          } else if (isQuestionOpen && !isShowAnswer) {
            btnClass = 'buzzer-dome-red border-4 border-yellow-300 text-white cursor-pointer buzzer-glow-ready';
            iconText = '⚡';
            labelText = '¡PULSAR AHORA!';
            subText = '¡Toca la pantalla para responder!';
            ringGlowClass = 'ring-8 ring-rose-500/70 animate-pulse';
          }

          window.handleMobileBuzzClick = () => {
            const currentGs = state.gameState || {};
            const currentB = state.buzzerState || {};

            // 1. Validar únicamente que la pregunta esté abierta y sin respuesta revelada
            if (currentGs.status !== "question_open" || currentGs.showAnswer) {
              return;
            }

            // 2. Validar que el concursante no haya participado ya en ESTA pregunta
            if (Boolean(currentGs.attemptedPlayerIds?.[playerId])) {
              return;
            }

            // 3. Validar que no haya buzzeado ya en esta pregunta
            if (hasBuzzed || playerLocalHasBuzzed) {
              return;
            }

            // 4. Registrar en Firebase y vibración táctil
            playerLocalHasBuzzed = true;
            const now = Date.now();
            const playerBuzzData = {
              playerId: playerId,
              playerName: myName || "Jugador",
              teamId: myTeam.id,
              timestamp: now
            };

            if ('vibrate' in navigator) {
              try { navigator.vibrate([70, 30, 70]); } catch (e) {}
            }

            sound.playBuzz();

            if (fbDb) {
              const sessionId = getFirebaseSessionId();
              try { fbDb.ref("jeopardy_game/buzzQueue").push(playerBuzzData); } catch (e) {}
              try { fbDb.ref(`sessions/${sessionId}/buzzQueue`).push(playerBuzzData); } catch (e) {}
              try { fbDb.ref(`sessions/${sessionId}/buzzers/${myPlayerId}`).set(playerBuzzData); } catch (e) {}

              // Si no hay ningún turno activo asignado en la mesa, tomar el turno de inmediato
              const actTurn = currentGs.activeTurn || currentB.activeTurn;
              if (!actTurn) {
                const newTurn = {
                  ...playerBuzzData,
                  startTime: now,
                  expiresAt: now + 10000,
                  answerTimeRemaining: 10
                };
                try {
                  fbDb.ref("jeopardy_game").update({
                    activeTurn: newTurn,
                    timerExpiresAt: now + 10000
                  });
                } catch (e) {}
                try {
                  fbDb.ref(`sessions/${sessionId}`).update({
                    activeTurn: newTurn,
                    timerExpiresAt: now + 10000
                  });
                  fbDb.ref(`sessions/${sessionId}/activeTurn`).set(newTurn);
                  fbDb.ref(`sessions/${sessionId}/activeQuestion/state`).set('buzzed');
                } catch (e) {}
              }
            }

            dispatchAction('PLAYER_BUZZ', playerBuzzData);
            render();
          };

          const existingBtn = document.getElementById('btn-player-buzz');
          const bezelContainer = document.getElementById('player-buzz-bezel');
          const bezelClass = `buzzer-collar-metal inline-flex items-center justify-center p-3.5 sm:p-4 rounded-full transition-all duration-200 ${ringGlowClass}`;
          const buttonBaseClass = `relative w-56 h-56 sm:w-64 sm:h-64 rounded-full font-cinzel font-black uppercase tracking-widest transition-all duration-100 flex flex-col items-center justify-center select-none overflow-hidden ${btnClass}`;

          if (!existingBtn || !bezelContainer) {
            stage.innerHTML = `
              <div id="player-buzz-bezel" class="${bezelClass}">
                <button
                  id="btn-player-buzz"
                  type="button"
                  onclick="window.handleMobileBuzzClick && window.handleMobileBuzzClick()"
                  ${isButtonDisabled ? 'disabled' : ''}
                  class="${buttonBaseClass}"
                  style="touch-action: manipulation;"
                >
                  <!-- Reflejo esférico superior de domo acrílico 3D -->
                  <span class="absolute inset-x-5 top-2 h-[46%] rounded-t-full bg-gradient-to-b from-white/45 via-white/10 to-transparent pointer-events-none"></span>
                  <!-- Reflejo inferior de contraluz -->
                  <span class="absolute inset-x-8 bottom-2.5 h-4 rounded-b-full bg-gradient-to-t from-white/20 to-transparent pointer-events-none"></span>

                  <span id="player-buzz-icon" class="text-3xl sm:text-4xl mb-1 relative z-10 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]">${iconText}</span>
                  <span id="player-buzz-text" class="text-xl sm:text-2xl font-black relative z-10 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] tracking-wider">${labelText}</span>
                  <span id="player-buzz-subtext" class="text-[11px] font-sans font-bold tracking-normal mt-2 px-4 leading-tight relative z-10 opacity-95 drop-shadow">
                    ${subText}
                  </span>
                </button>
              </div>
            `;
          } else {
            // El botón ya existe: actualizar estado/clases/textos y handler directamente
            bezelContainer.className = bezelClass;
            existingBtn.disabled = isButtonDisabled;
            existingBtn.className = buttonBaseClass;
            existingBtn.onclick = window.handleMobileBuzzClick;
            const iconEl = document.getElementById('player-buzz-icon');
            if (iconEl) iconEl.textContent = iconText;
            const textEl = document.getElementById('player-buzz-text');
            if (textEl) textEl.textContent = labelText;
            const subtextEl = document.getElementById('player-buzz-subtext');
            if (subtextEl) subtextEl.textContent = subText;
          }
        }
      }

      function renderPlayerLoggedOutNotice() {
        const app = document.getElementById('app');
        if (!app) return;
        app.innerHTML = `
          <div class="min-h-screen bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A] p-4 flex items-center justify-center">
            <div class="w-full max-w-sm bg-[#000842] border-4 border-rose-500 rounded-3xl p-6 text-center space-y-4 shadow-2xl animate-in zoom-in-95">
              <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/20 border-2 border-rose-500 flex items-center justify-center text-rose-400 text-3xl font-black">
                !
              </div>
              <h2 class="text-xl font-black text-white uppercase font-cinzel">
                Sesión Finalizada
              </h2>
              <p class="text-xs sm:text-sm text-blue-200 leading-relaxed">
                El anfitrión del concurso ha cerrado la sesión global. Esta pantalla ha sido desconectada.
              </p>
              <div class="pt-2">
                <a
                  href="?"
                  class="block w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs uppercase"
                >
                  Volver al Inicio
                </a>
              </div>
            </div>
          </div>
        `;
      }

      // Iniciar sincronización de red e interfaz de manera robusta
      try {
        initNetworkSync();
      } catch (err) {
        console.warn('Advertencia al iniciar sincronización de red:', err);
      }

      try {
        render();
      } catch (err) {
        console.error('Error crítico en el renderizado inicial:', err);
        var app = document.getElementById('app');
        if (app) {
          app.innerHTML = `
            <div class="min-h-screen bg-[#000533] p-4 flex items-center justify-center">
              <div class="w-full max-w-md bg-[#000842] border-2 border-amber-400 p-6 rounded-2xl text-center space-y-4 shadow-2xl">
                <div class="w-12 h-12 mx-auto rounded-xl bg-amber-500/20 border border-amber-400 flex items-center justify-center text-amber-400 text-2xl font-black">
                  !
                </div>
                <h2 class="text-xl font-black text-amber-400 uppercase font-cinzel">Error al Cargar la Aplicación</h2>
                <p class="text-xs text-slate-300 leading-relaxed">${err && err.message ? err.message : String(err)}</p>
                <div class="pt-2 flex gap-2 justify-center">
                  <button onclick="localStorage.clear();sessionStorage.clear();location.reload();" class="px-4 py-2.5 bg-[#FFCC00] text-[#000533] font-black text-xs uppercase rounded-xl cursor-pointer">
                    Restablecer y Recargar
                  </button>
                  <button onclick="location.reload();" class="px-4 py-2.5 bg-slate-800 text-slate-200 font-bold text-xs uppercase rounded-xl border border-slate-600 cursor-pointer">
                    Reintentar
                  </button>
                </div>
              </div>
            </div>
          `;
        }
      }
    })();
  </script>
</body>
</html>
