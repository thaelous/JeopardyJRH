  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- React 18 & ReactDOM 18 CDN -->

    /* Subtle animations */
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    .animate-pulse-fast {
      animation: pulse-fast 1s infinite ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }

<body class="bg-[#000533] text-white antialiased min-h-screen selection:bg-[#FFCC00] selection:text-[#000533]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- 1. SINTETIZADOR DE SONIDOS WEB AUDIO API (100% NATIVO SIN ARCHIVOS EXTERNOS) ---
    class SoundSynthesizer {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playSelect() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(660, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }
      playBuzz() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [220, 277.18, 329.63, 440].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        });
      }
      playCorrect() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 1046.5]; // C5, E5, G5, C6
        notes.forEach((freq, index) => {
          const startTime = now + index * 0.08;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.36);
        });
      }
      playWrong() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [150, 155].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.51);
        });
      }
      playTimeUp() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        // Alarm triple pulse
        [0, 0.15, 0.3].forEach(delay => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(880, now + delay);
          gain.gain.setValueAtTime(0.3, now + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + delay);
          osc.stop(now + delay + 0.11);
        });
      }
    }
    const soundManager = new SoundSynthesizer();

    // --- 2. PREGUNTAS POR DEFECTO ---
    const DEFAULT_CATEGORIES = [
      {
        id: 'cat-1',
        title: 'Historia',
        clues: [
          { id: 'c1-100', value: 100, question: 'Año en que ocurrió la llegada de Cristóbal Colón a América.', answer: '1492', isAnswered: false },
          { id: 'c1-200', value: 200, question: 'Civilización antigua que construyó la ciudadela de Machu Picchu.', answer: 'Los Incas', isAnswered: false },
          { id: 'c1-300', value: 300, question: 'Primer emperador de la Roma Imperial tras la caída de la República.', answer: 'César Augusto (Octavio)', isAnswered: false },
          { id: 'c1-400', value: 400, question: 'Tratado firmado en 1919 que puso fin oficial a la Primera Guerra Mundial.', answer: 'Tratado de Versalles', isAnswered: false },
          { id: 'c1-500', value: 500, question: 'Filósofo y jurista del siglo XVIII considerado el padre de la división de poderes.', answer: 'Montesquieu', isAnswered: false },
        ]
      },
      {
        id: 'cat-2',
        title: 'Ciencia',
        clues: [
          { id: 'c2-100', value: 100, question: 'Elemento químico más abundante en el universo observable.', answer: 'Hidrógeno', isAnswered: false },
          { id: 'c2-200', value: 200, question: 'Fuerza invisible que atrae los cuerpos con masa hacia el centro de la Tierra.', answer: 'Gravedad', isAnswered: false },
          { id: 'c2-300', value: 300, question: 'Organelo celular conocido como la central energética de las células eucariotas.', answer: 'Mitocondria', isAnswered: false },
          { id: 'c2-400', value: 400, question: 'Velocidad aproximada de la luz en el vacío en kilómetros por segundo.', answer: '300.000 km/s', isAnswered: false },
          { id: 'c2-500', value: 500, question: 'Partícula subatómica de carga neutra ubicada en el núcleo de los átomos.', answer: 'Neutrón', isAnswered: false },
        ]
      },
      {
        id: 'cat-3',
        title: 'Geografía',
        clues: [
          { id: 'c3-100', value: 100, question: 'Río más largo y caudaloso del planeta Tierra.', answer: 'Río Amazonas', isAnswered: false },
          { id: 'c3-200', value: 200, question: 'País con mayor superficie territorial en el mundo.', answer: 'Rusia', isAnswered: false },
          { id: 'c3-300', value: 300, question: 'Cordillera montañosa más extensa del continente americano y del mundo.', answer: 'Cordillera de los Andes', isAnswered: false },
          { id: 'c3-400', value: 400, question: 'Capital oficial de Australia.', answer: 'Canberra', isAnswered: false },
          { id: 'c3-500', value: 500, question: 'Desierto no polar más árido del mundo, ubicado al norte de Chile.', answer: 'Desierto de Atacama', isAnswered: false },
        ]
      },
      {
        id: 'cat-4',
        title: 'Cultura Pop',
        clues: [
          { id: 'c4-100', value: 100, question: 'Superhéroe millonario cuya verdadera identidad es Bruce Wayne.', answer: 'Batman', isAnswered: false },
          { id: 'c4-200', value: 200, question: 'Banda británica formada en Liverpool por John, Paul, George y Ringo.', answer: 'The Beatles', isAnswered: false },
          { id: 'c4-300', value: 300, question: 'Película de ciencia ficción de James Cameron ambientada en la luna Pandora.', answer: 'Avatar', isAnswered: false },
          { id: 'c4-400', value: 400, question: 'Mascota y símbolo principal de la franquicia Pokémon.', answer: 'Pikachu', isAnswered: false },
          { id: 'c4-500', value: 500, question: 'Serie de novelas fantásticas escrita por J.R.R. Tolkien protagonizada por Frodo.', answer: 'El Señor de los Anillos', isAnswered: false },
        ]
      },
      {
        id: 'cat-5',
        title: 'Deportes',
        clues: [
          { id: 'c5-100', value: 100, question: 'País que ha ganado la mayor cantidad de Copas Mundiales de Fútbol Masculino (5 títulos).', answer: 'Brasil', isAnswered: false },
          { id: 'c5-200', value: 200, question: 'Puntuación máxima perfecta que se puede lograr en una línea de boliche (bowling).', answer: '300 puntos', isAnswered: false },
          { id: 'c5-300', value: 300, question: 'Atleta jamaiquino que ostenta el récord mundial de 100 y 200 metros planos.', answer: 'Usain Bolt', isAnswered: false },
          { id: 'c5-400', value: 400, question: 'Torneo de tenis sobre césped más antiguo y prestigioso del mundo.', answer: 'Wimbledon', isAnswered: false },
          { id: 'c5-500', value: 500, question: 'Número de jugadores por equipo en cancha en un partido oficial de básquetbol.', answer: '5 jugadores', isAnswered: false },
        ]
      }
    ];

    // Equipos con colores oficiales (hasta 5)
    const ALL_TEAMS_TEMPLATE = [
      { id: 'team-1', name: 'Equipo Azul', color: '#2563EB', textColor: '#FFFFFF', score: 0, members: [] },
      { id: 'team-2', name: 'Equipo Rojo', color: '#DC2626', textColor: '#FFFFFF', score: 0, members: [] },
      { id: 'team-3', name: 'Equipo Verde', color: '#16A34A', textColor: '#FFFFFF', score: 0, members: [] },
      { id: 'team-4', name: 'Equipo Dorado', color: '#CA8A04', textColor: '#FFFFFF', score: 0, members: [] },
      { id: 'team-5', name: 'Equipo Morado', color: '#9333EA', textColor: '#FFFFFF', score: 0, members: [] },
    ];

    const STORAGE_KEY = 'jeopardy_ghpages_state';
    const BROADCAST_NAME = 'jeopardy_channel_ghpages';

    function getInitialState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          return JSON.parse(saved);
        }
      } catch (e) {
        console.warn('Could not read from localStorage', e);
      }
      return {
        status: 'setup', // 'setup' | 'playing' | 'game_over'
        title: 'Gran Torneo Jeopardy',
        categories: DEFAULT_CATEGORIES,
        teams: ALL_TEAMS_TEMPLATE.slice(0, 3), // 3 equipos por defecto
        activeClue: null,
        buzzerState: {
          isOpen: false,
          buzzedTeamId: null,
          buzzedPlayerName: null,
          buzzedAt: null,
          answerTimeLimit: 10,
          answerTimeRemaining: 10,
          playerAnswer: null,
          lockedTeams: [],
          buzzQueue: []
        },
        settings: {
          penalizeWrongAnswer: true,
          soundEnabled: true
        }
      };
    }

    // --- COMPONENTE PRINCIPAL ---
    function App() {
      const [gameState, setGameState] = useState(getInitialState);
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('jeopardy_auth_ghpages') === 'true';
      });
      const [role, setRole] = useState(() => {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('role') === 'player' ? 'player' : 'host';
      });

      // Modales y estados UI
      const [isSimulatorOpen, setIsSimulatorOpen] = useState(false);
      const [isLogoutModalOpen, setIsLogoutModalOpen] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [authError, setAuthError] = useState(false);
      const [isSubmittingAuth, setIsSubmittingAuth] = useState(false);

      // Sincronización BroadcastChannel y localStorage
      const bcRef = useRef(null);

      useEffect(() => {
        try {
          if ('BroadcastChannel' in window) {
            bcRef.current = new BroadcastChannel(BROADCAST_NAME);
            bcRef.current.onmessage = (event) => {
              if (event.data && event.data.type === 'STATE_UPDATE') {
                setGameState(event.data.state);
              } else if (event.data && event.data.type === 'GLOBAL_LOGOUT') {
                setIsAuthenticated(false);
                sessionStorage.removeItem('jeopardy_auth_ghpages');
              }
            };
          }
        } catch (e) {
          console.warn('BroadcastChannel error', e);
        }

        const handleStorageChange = (e) => {
          if (e.key === STORAGE_KEY && e.newValue) {
            try {
              setGameState(JSON.parse(e.newValue));
            } catch (err) {}
          }
        };
        window.addEventListener('storage', handleStorageChange);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          if (bcRef.current) bcRef.current.close();
        };
      }, []);

      const saveAndBroadcast = useCallback((newState) => {
        setGameState(newState);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(newState));
          if (bcRef.current) {
            bcRef.current.postMessage({ type: 'STATE_UPDATE', state: newState });
          }
        } catch (e) {
          console.error('Error saving state', e);
        }
      }, []);

      // --- TEMPORIZADOR DE 10 SEGUNDOS AUTORITATIVO PARA EL ANFITRIÓN ---
      useEffect(() => {
        if (role !== 'host') return;
        const bState = gameState.buzzerState;
        if (!gameState.activeClue || gameState.activeClue.state !== 'buzzed' || !bState.buzzedTeamId) {
          return;
        }

        // Si el participante ya envió la respuesta, detenemos el contador
        if (bState.playerAnswer) return;

        const timer = setInterval(() => {
          setGameState(prev => {
            const curBState = prev.buzzerState;
            if (
              !prev.activeClue ||
              prev.activeClue.state !== 'buzzed' ||
              !curBState.buzzedTeamId ||
              curBState.playerAnswer
            ) {
              clearInterval(timer);
              return prev;
            }

            const currentRemaining = curBState.answerTimeRemaining ?? 10;
            if (currentRemaining <= 1) {
              clearInterval(timer);
              // ¡TIEMPO AGOTADO! Calificar automáticamente como errónea
              soundManager.playTimeUp();
              soundManager.playWrong();

              const failedTeamId = curBState.buzzedTeamId;
              const nextLocked = [...(curBState.lockedTeams || [])];
              if (!nextLocked.includes(failedTeamId)) nextLocked.push(failedTeamId);

              // Aplicar penalización si está activa
              const updatedTeams = prev.teams.map(t => {
                if (t.id === failedTeamId && prev.settings.penalizeWrongAnswer) {
                  return { ...t, score: t.score - prev.activeClue.value };
                }
                return t;
              });

              // Rebote al siguiente equipo o abrir pulsadores para los demás
              const remainingTeams = updatedTeams.filter(t => !nextLocked.includes(t.id));
              let nextState = { ...prev };

              if (curBState.buzzQueue && curBState.buzzQueue.length > 0) {
                const nextBuzz = curBState.buzzQueue[0];
                const updatedQueue = curBState.buzzQueue.slice(1);
                nextState = {
                  ...prev,
                  teams: updatedTeams,
                  buzzerState: {
                    ...curBState,
                    isOpen: false,
                    buzzedTeamId: nextBuzz.teamId,
                    buzzedPlayerName: nextBuzz.memberName,
                    buzzedAt: Date.now(),
                    answerTimeLimit: 10,
                    answerTimeRemaining: 10,
                    playerAnswer: null,
                    lockedTeams: nextLocked,
                    buzzQueue: updatedQueue
                  }
                };
              } else if (remainingTeams.length > 0) {
                // Reabrir para los equipos restantes
                nextState = {
                  ...prev,
                  teams: updatedTeams,
                  activeClue: { ...prev.activeClue, state: 'buzzing_open' },
                  buzzerState: {
                    ...curBState,
                    isOpen: true,
                    buzzedTeamId: null,
                    buzzedPlayerName: null,
                    buzzedAt: null,
                    answerTimeLimit: 10,
                    answerTimeRemaining: 10,
                    playerAnswer: null,
                    lockedTeams: nextLocked
                  }
                };
              } else {
                // Todos agotaron intentos -> Revelar
                const nextCats = prev.categories.map(cat => ({
                  ...cat,
                  clues: cat.clues.map(cl => cl.id === prev.activeClue.id ? { ...cl, isAnswered: true } : cl)
                }));
                nextState = {
                  ...prev,
                  categories: nextCats,
                  teams: updatedTeams,
                  activeClue: { ...prev.activeClue, state: 'revealed' },
                  buzzerState: {
                    ...curBState,
                    isOpen: false,
                    buzzedTeamId: null,
                    buzzedPlayerName: null,
                    playerAnswer: null,
                    answerTimeRemaining: 0
                  }
                };
              }

              try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(nextState));
                if (bcRef.current) bcRef.current.postMessage({ type: 'STATE_UPDATE', state: nextState });
              } catch (e) {}
              return nextState;
            }

            const updated = {
              ...prev,
              buzzerState: {
                ...curBState,
                answerTimeRemaining: currentRemaining - 1
              }
            };
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
              if (bcRef.current) bcRef.current.postMessage({ type: 'STATE_UPDATE', state: updated });
            } catch (e) {}
            return updated;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [role, gameState.activeClue?.id, gameState.activeClue?.state, gameState.buzzerState?.buzzedTeamId]);

      // --- AUTENTICACIÓN OBLIGATORIA (Altair16) ---
      const handleLogin = (e) => {
        e.preventDefault();
        setIsSubmittingAuth(true);
        soundManager.init();

        setTimeout(() => {
          if (passwordInput.trim() === 'Altair16') {
            soundManager.playCorrect();
            sessionStorage.setItem('jeopardy_auth_ghpages', 'true');
            setIsAuthenticated(true);
            setAuthError(false);
          } else {
            soundManager.playWrong();
            setAuthError(true);
          }
          setIsSubmittingAuth(false);
        }, 300);
      };

      const handleGlobalLogout = () => {
        setIsAuthenticated(false);
        sessionStorage.removeItem('jeopardy_auth_ghpages');
        setIsLogoutModalOpen(false);
        if (bcRef.current) {
          bcRef.current.postMessage({ type: 'GLOBAL_LOGOUT' });
        }
      };

      // Si es rol jugador, mostramos la vista de pulsador móvil
      if (role === 'player') {
        return <PlayerMobileView gameState={gameState} onStateChange={saveAndBroadcast} onSwitchToHost={() => setRole('host')} />;
      }

      // Pantalla de Bloqueo de Seguridad inicial
      if (!isAuthenticated) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A]">
            <div className="w-full max-w-md bg-[#000842] border-4 border-[#D4AF37] rounded-3xl p-6 sm:p-8 shadow-[0_0_60px_rgba(212,175,55,0.4)] text-center space-y-6">
              <div className="w-20 h-20 mx-auto rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center shadow-lg transform -rotate-3 hover:rotate-0 transition-transform">
                <span className="font-cinzel text-4xl font-black text-[#FFCC00]">J!</span>
              </div>
              <div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-wider text-white uppercase font-cinzel">
                  Acceso Restringido
                </h1>
                <p className="text-xs sm:text-sm text-blue-200 mt-2">
                  Ingresa la contraseña de anfitrión para acceder al panel de control y tablero.
                </p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div className="relative">
                  <input
                    type={showPassword ? 'text' : 'password'}
                    value={passwordInput}
                    onChange={(e) => {
                      setPasswordInput(e.target.value);
                      if (authError) setAuthError(false);
                    }}
                    placeholder="Contraseña de anfitrión..."
                    className={`w-full py-3.5 px-4 pr-12 rounded-xl bg-[#000324] border-2 ${
                      authError ? 'border-rose-500 animate-shake' : 'border-blue-500/60 focus:border-[#FFCC00]'
                    } text-white font-bold text-center tracking-widest placeholder-blue-400/50 outline-none transition-all`}
                    autoFocus
                  />
                  <button
                    type="button"
                    onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3.5 top-1/2 -translate-y-1/2 text-blue-300 hover:text-[#FFCC00] text-xs font-bold"
                  >
                    {showPassword ? 'OCULTAR' : 'VER'}
                  </button>
                </div>

                {authError && (
                  <p className="text-xs font-bold text-rose-400 bg-rose-950/50 py-2 px-3 rounded-lg border border-rose-500">
                    Contraseña incorrecta. Se requiere la clave de anfitrión.
                  </p>
                )}

                <button
                  type="submit"
                  disabled={isSubmittingAuth || !passwordInput.trim()}
                  className="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#D4AF37] via-[#FFCC00] to-[#D4AF37] text-[#000533] font-black text-sm uppercase tracking-widest hover:brightness-110 active:scale-98 transition-all shadow-lg border-2 border-white cursor-pointer disabled:opacity-50"
                >
                  {isSubmittingAuth ? 'Verificando...' : 'Desbloquear Sistema'}
                </button>
              </form>

              <div className="pt-2 border-t border-blue-900/60 flex items-center justify-between text-xs text-blue-300">
                <span>Versión GitHub Pages</span>
                <button
                  type="button"
                  onClick={() => setRole('player')}
                  className="text-[#FFCC00] hover:underline font-bold"
                >
                  Entrar como Jugador
                </button>
              </div>
            </div>
          </div>
        );
      }

      const [teamCount, setTeamCount] = useState(gameState.teams.length);
      const [teams, setTeams] = useState(gameState.teams);

      const [activeTeamId, setActiveTeamId] = useState(gameState.teams[0]?.id || 'team-1');

      // Generar URL para códigos QR
      const playerUrl = useMemo(() => {
        const base = window.location.href.split('?')[0];
        return `${base}?role=player`;
      }, []);

      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(playerUrl)}&bgcolor=ffffff&color=000533`;

      const handleTeamCountChange = (count) => {
        setTeamCount(count);
        const updated = ALL_TEAMS_TEMPLATE.slice(0, count).map((t, idx) => {
          const existing = teams.find(et => et.id === t.id);
          return existing || t;
        });
        setTeams(updated);
      };

      const handleAddMember = (teamId) => {
        if (!memberInput.trim()) return;
        const updated = teams.map(t => {
          if (t.id === teamId) {
            return {
              ...t,
              members: [...t.members, { id: 'm-' + Date.now(), name: memberInput.trim() }]
            };
          }
          return t;
        });
        setTeams(updated);
        setMemberInput('');
      };

      const handleRemoveMember = (teamId, memberId) => {
        const updated = teams.map(t => {
          if (t.id === teamId) {
            return { ...t, members: t.members.filter(m => m.id !== memberId) };
          }
          return t;
        });
        setTeams(updated);
      };

        onUpdateState({
          ...gameState,
          title,
          teams
        });

                >

                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {/* Columna Izquierda: Ajustes Generales y QR */}

                <div>

                {/* Código QR para Participantes */}
                <div className="bg-[#000324] border-2 border-blue-800/80 rounded-2xl p-3.5 text-center space-y-2">
                  <span className="text-[11px] font-black uppercase tracking-wider text-[#FFCC00] block">

    // --- MODAL DE PISTA CON TEMPORIZADOR DE 10 SEGUNDOS ---
    function ClueModal({ gameState, onStateChange }) {
      const clue = gameState.activeClue;
      const bState = gameState.buzzerState;
      const buzzedTeam = gameState.teams.find(t => t.id === bState.buzzedTeamId);

      const handleOpenBuzzers = () => {
        soundManager.playSelect();
        onStateChange({
          ...gameState,
          activeClue: { ...clue, state: 'buzzing_open' },
          buzzerState: {
            ...bState,
            isOpen: true,
            buzzedTeamId: null,
            buzzedPlayerName: null,
            buzzedAt: null,
            answerTimeLimit: 10,
            answerTimeRemaining: 10,
            playerAnswer: null,
            lockedTeams: []
          }
        });
      };

      const handleJudgeCorrect = () => {
        if (!buzzedTeam) return;
        soundManager.playCorrect();
        if (typeof confetti === 'function') {
          confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }
        const updatedTeams = gameState.teams.map(t => t.id === buzzedTeam.id ? { ...t, score: t.score + clue.value } : t);
        const updatedCats = gameState.categories.map(cat => ({
          ...cat,
          clues: cat.clues.map(c => c.id === clue.id ? { ...c, isAnswered: true } : c)
        }));

        onStateChange({
          ...gameState,
          teams: updatedTeams,
          categories: updatedCats,
          activeClue: { ...clue, state: 'revealed' },
          buzzerState: { ...bState, isOpen: false, answerTimeRemaining: 0 }
        });
      };

      const handleJudgeWrong = () => {
        if (!buzzedTeam) return;
        soundManager.playWrong();
        const failedTeamId = buzzedTeam.id;
        const nextLocked = [...(bState.lockedTeams || [])];
        if (!nextLocked.includes(failedTeamId)) nextLocked.push(failedTeamId);

        const updatedTeams = gameState.teams.map(t => {
          if (t.id === failedTeamId && gameState.settings.penalizeWrongAnswer) {
            return { ...t, score: t.score - clue.value };
          }
          return t;
        });

        // Revisar si queda otro equipo disponible para rebote
        const remainingTeams = updatedTeams.filter(t => !nextLocked.includes(t.id));

        if (bState.buzzQueue && bState.buzzQueue.length > 0) {
          const nextBuzz = bState.buzzQueue[0];
          onStateChange({
            ...gameState,
            teams: updatedTeams,
            buzzerState: {
              ...bState,
              isOpen: false,
              buzzedTeamId: nextBuzz.teamId,
              buzzedPlayerName: nextBuzz.memberName,
              buzzedAt: Date.now(),
              answerTimeLimit: 10,
              answerTimeRemaining: 10,
              playerAnswer: null,
              lockedTeams: nextLocked,
              buzzQueue: bState.buzzQueue.slice(1)
            }
          });
        } else if (remainingTeams.length > 0) {
          onStateChange({
            ...gameState,
            teams: updatedTeams,
            activeClue: { ...clue, state: 'buzzing_open' },
            buzzerState: {
              ...bState,
              isOpen: true,
              buzzedTeamId: null,
              buzzedPlayerName: null,
              buzzedAt: null,
              answerTimeLimit: 10,
              answerTimeRemaining: 10,
              playerAnswer: null,
              lockedTeams: nextLocked
            }
          });
        } else {
          // Todos fallaron -> Revelar
          const updatedCats = gameState.categories.map(cat => ({
            ...cat,
            clues: cat.clues.map(c => c.id === clue.id ? { ...c, isAnswered: true } : c)
          }));
          onStateChange({
            ...gameState,
            teams: updatedTeams,
            categories: updatedCats,
            activeClue: { ...clue, state: 'revealed' },
            buzzerState: { ...bState, isOpen: false, buzzedTeamId: null, answerTimeRemaining: 0 }
          });
        }
      };

      const handleCloseClue = () => {
        const updatedCats = gameState.categories.map(cat => ({
          ...cat,
          clues: cat.clues.map(c => c.id === clue.id ? { ...c, isAnswered: true } : c)
        }));
        onStateChange({
          ...gameState,
          categories: updatedCats,
          activeClue: null,
          buzzerState: {
            isOpen: false,
            buzzedTeamId: null,
            buzzedPlayerName: null,
            buzzedAt: null,
            answerTimeLimit: 10,
            answerTimeRemaining: 10,
            playerAnswer: null,
            lockedTeams: [],
            buzzQueue: []
          }
        });
      };

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center p-3 sm:p-6 bg-black/90 backdrop-blur-md animate-in fade-in duration-150">
          <div className="w-full max-w-4xl bg-[#000222] border-4 border-[#D4AF37] rounded-3xl p-5 sm:p-8 shadow-[0_0_60px_rgba(212,175,55,0.4)] flex flex-col justify-between min-h-[480px] max-h-[92vh] overflow-y-auto">
            
            {/* Encabezado del modal */}
            <div className="flex items-center justify-between border-b-2 border-blue-900/60 pb-3">
              <span className="font-cinzel text-sm sm:text-base font-black text-[#FFCC00] uppercase tracking-wider">
                {clue.categoryTitle || 'Pista'} • ${clue.value}
              </span>
              <button
                onClick={handleCloseClue}
                className="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-black text-sm flex items-center justify-center cursor-pointer"
              >
                ✕
              </button>
            </div>

            {/* Pregunta principal en estilo Jeopardy */}
            <div className="my-6 sm:my-8 text-center px-4">
              <h2 className="text-xl sm:text-3xl md:text-4xl font-black text-white font-cinzel tracking-wide leading-relaxed drop-shadow-md">
                "{clue.question}"
              </h2>

              {/* Respuesta si ya está revelada */}
              {clue.state === 'revealed' && (
                <div className="mt-6 p-4 rounded-2xl bg-emerald-950/80 border-2 border-emerald-400 text-center animate-in zoom-in-95">
                  <span className="text-xs font-black uppercase tracking-wider text-emerald-300 block mb-1">
                    Respuesta Correcta
                  </span>
                  <span className="text-xl sm:text-2xl font-black text-white font-cinzel">
                    {clue.answer}
                  </span>
                </div>
              )}
            </div>

            {/* Estado del Pulsador y Temporizador de 10 Segundos */}
            <div className="space-y-4">
              {clue.state === 'reading' && (
                <div className="text-center">
                  <button
                    onClick={handleOpenBuzzers}
                    className="py-4 px-8 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-sm sm:text-base uppercase tracking-widest shadow-[0_0_30px_rgba(16,185,129,0.5)] border-2 border-white cursor-pointer active:scale-98 transition-all"
                  >
                    Habilitar Pulsadores para los Equipos
                  </button>
                  <p className="text-xs text-blue-300 mt-2">
                    Los participantes podrán pulsar desde sus teléfonos móviles o el simulador.
                  </p>
                </div>
              )}

              {clue.state === 'buzzing_open' && (
                <div className="p-4 rounded-2xl bg-[#060CE9]/40 border-2 border-[#FFCC00] text-center animate-pulse-fast">
                  <span className="text-sm sm:text-base font-black text-[#FFCC00] uppercase tracking-widest block">
                    ¡PULSADORES ABIERTOS! ESPERANDO PARTICIPANTE...
                  </span>
                  <span className="text-xs text-blue-200 mt-1 block">
                    El primer equipo en oprimir el botón tendrá el turno.
                  </span>
                </div>
              )}

              {clue.state === 'buzzed' && buzzedTeam && (
                <div
                  className="p-4 sm:p-5 rounded-2xl border-4 text-center space-y-3 shadow-xl"
                  style={{ backgroundColor: buzzedTeam.color + '22', borderColor: buzzedTeam.color }}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-black uppercase tracking-wider text-white">
                      Turno Asignado:
                    </span>
                    <span
                      className="px-3 py-1 rounded-xl text-xs sm:text-sm font-black text-white uppercase tracking-wider"
                      style={{ backgroundColor: buzzedTeam.color }}
                    >
                      {buzzedTeam.name}
                    </span>
                  </div>

                  <div className="text-lg sm:text-xl font-black text-white">
                    Participante: <strong className="text-[#FFCC00]">{bState.buzzedPlayerName}</strong>
                  </div>

                  {/* CUENTA REGRESIVA DE 10 SEGUNDOS */}
                  {bState.playerAnswer ? (
                    <div className="p-2.5 rounded-xl bg-emerald-500/20 border border-emerald-400 text-emerald-300 text-xs font-bold">
                      Respuesta enviada a tiempo: <span className="text-white text-sm font-black">"{bState.playerAnswer}"</span>
                    </div>
                  ) : (
                    <div className="p-3 rounded-xl bg-amber-500/20 border-2 border-amber-400 text-center space-y-2">
                      <div className="flex items-center justify-between text-xs font-black uppercase text-amber-300">
                        <span>Tiempo para escribir respuesta:</span>
                        <span className="font-mono text-base font-black px-2 py-0.5 rounded bg-amber-500 text-black">
                          {bState.answerTimeRemaining ?? 10}s
                        </span>
                      </div>
                      <div className="w-full bg-amber-950 h-2.5 rounded-full overflow-hidden">
                        <div
                          className="h-full bg-amber-400 transition-all duration-1000 ease-linear rounded-full"
                          style={{ width: `${((bState.answerTimeRemaining ?? 10) / 10) * 100}%` }}
                        />
                      </div>
                      <p className="text-[11px] text-amber-200">
                        Si no escribe la respuesta en 10 segundos, será considerada errónea automáticamente.
                      </p>
                    </div>
                  )}

                  {/* Botones de Calificación del Anfitrión */}
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <button
                      onClick={handleJudgeCorrect}
                      className="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow border border-emerald-300 cursor-pointer"
                    >
                      Correcto (+${clue.value})
                    </button>
                    <button
                      onClick={handleJudgeWrong}
                      className="py-3 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-black text-xs sm:text-sm uppercase tracking-wider shadow border border-rose-300 cursor-pointer"
                    >
                      Incorrecto / Pasar (-${clue.value})
                    </button>
                  </div>
                </div>
              )}

              {/* Botón de cierre en estado revelado */}
              {clue.state === 'revealed' && (
                <button
                  onClick={handleCloseClue}
                  className="w-full py-3.5 rounded-xl bg-[#FFCC00] hover:bg-yellow-300 text-[#000533] font-black text-sm uppercase tracking-widest shadow cursor-pointer"
                >
                  Cerrar Pista y Volver al Tablero
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    // --- VISTA MÓVIL DEL JUGADOR (?role=player) ---
    function PlayerMobileView({ gameState, onStateChange, onSwitchToHost }) {
      const [selectedTeamId, setSelectedTeamId] = useState(gameState.teams[0]?.id || 'team-1');
      const [playerName, setPlayerName] = useState(() => localStorage.getItem('jeopardy_player_name') || '');
      const [hasJoined, setHasJoined] = useState(() => !!localStorage.getItem('jeopardy_player_name'));
      const [answerInput, setAnswerInput] = useState('');
      const [hasSubmitted, setHasSubmitted] = useState(false);

      const bState = gameState.buzzerState;
      const myTeam = gameState.teams.find(t => t.id === selectedTeamId);
      const isMyTeamBuzzed = bState.buzzedTeamId === selectedTeamId;
      const isBuzzerOpen = bState.isOpen;
      const isLocked = (bState.lockedTeams || []).includes(selectedTeamId);

      const handleJoin = (e) => {
        e.preventDefault();
        if (!playerName.trim()) return;
        localStorage.setItem('jeopardy_player_name', playerName.trim());
        setHasJoined(true);
        soundManager.init();
      };

      const handlePressBuzz = () => {
        if (!isBuzzerOpen || isLocked) return;
        soundManager.playBuzz();

        const updatedBState = {
          ...bState,
          isOpen: false,
          buzzedTeamId: selectedTeamId,
          buzzedPlayerName: playerName.trim(),
          buzzedAt: Date.now(),
          answerTimeLimit: 10,
          answerTimeRemaining: 10,
          playerAnswer: null
        };

        const nextActive = gameState.activeClue ? { ...gameState.activeClue, state: 'buzzed' } : null;

        onStateChange({
          ...gameState,
          activeClue: nextActive,
          buzzerState: updatedBState
        });
        setHasSubmitted(false);
      };

      const handleSubmitAnswer = (e) => {
        e.preventDefault();
        if (!answerInput.trim() || !isMyTeamBuzzed) return;

        soundManager.playSelect();
        const updatedBState = {
          ...bState,
          playerAnswer: answerInput.trim()
        };
        onStateChange({
          ...gameState,
          buzzerState: updatedBState
        });
        setHasSubmitted(true);
      };

      // Si aún no se ha unido con nombre y equipo
      if (!hasJoined) {
        return (
          <div className="min-h-screen bg-gradient-to-b from-[#000533] via-[#020B4A] to-[#00021A] p-4 flex items-center justify-center">
            <div className="w-full max-w-sm bg-[#000842] border-4 border-[#FFCC00] rounded-3xl p-6 text-center space-y-5 shadow-2xl">
              <div className="w-16 h-16 mx-auto rounded-2xl bg-[#060CE9] border-2 border-[#FFCC00] flex items-center justify-center font-cinzel text-3xl font-black text-[#FFCC00]">
                J!
              </div>
              <div>
                <h2 className="text-xl font-black text-white uppercase font-cinzel">
                  Unirse al Concurso
                </h2>
                <p className="text-xs text-blue-200 mt-1">
                  Elige tu equipo e ingresa tu nombre para usar el pulsador.
                </p>
              </div>

              <form onSubmit={handleJoin} className="space-y-4">
                <div>
                  <label className="block text-[11px] font-black uppercase tracking-wider text-blue-200 mb-1 text-left">
                    Selecciona tu Equipo
                  </label>
                  <select
                    value={selectedTeamId}
                    onChange={(e) => setSelectedTeamId(e.target.value)}
                    className="w-full py-3 px-3 rounded-xl bg-[#000324] border-2 border-blue-500 text-white font-bold text-sm outline-none"
                  >
                    {gameState.teams.map((t) => (
                      <option key={t.id} value={t.id}>
                        {t.name}
                      </option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-[11px] font-black uppercase tracking-wider text-blue-200 mb-1 text-left">
                    Tu Nombre
                  </label>
                  <input
                    type="text"
                    required
                    value={playerName}
                    onChange={(e) => setPlayerName(e.target.value)}
                    placeholder="Ej. Carlos..."
                    className="w-full py-3 px-3 rounded-xl bg-[#000324] border-2 border-blue-500 text-white font-bold text-sm outline-none focus:border-[#FFCC00]"
                  />
                </div>

                <button
                  type="submit"
                  className="w-full py-3.5 rounded-xl bg-[#FFCC00] hover:bg-yellow-300 text-[#000533] font-black text-sm uppercase tracking-widest shadow-lg cursor-pointer"
                >
                  Entrar a la Sala
                </button>
              </form>

              <button
                type="button"
                onClick={onSwitchToHost}
                className="text-xs text-blue-300 hover:text-white underline pt-2"
              >
                Volver a la vista de Anfitrión
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#000533] flex flex-col justify-between p-4 max-w-md mx-auto">
          {/* Barra del Jugador */}
          <div className="flex items-center justify-between bg-[#000842] border-2 border-blue-800 rounded-2xl p-3">
            <div className="flex items-center gap-2">
              <span className="w-3.5 h-3.5 rounded-full" style={{ backgroundColor: myTeam?.color || '#2563EB' }} />
              <div>
                <span className="text-xs font-black text-white block">{myTeam?.name}</span>
                <span className="text-[11px] text-blue-300">{playerName}</span>
              </div>
            </div>
            <button
              onClick={() => {
                localStorage.removeItem('jeopardy_player_name');
                setHasJoined(false);
              }}
              className="text-[11px] text-blue-400 hover:text-white"
            >
              Cambiar
            </button>
          </div>

          {/* Área Central: Pulsador Gigante o Formulario de Respuesta con 10s */}
          <div className="my-auto py-6 text-center">
            {isMyTeamBuzzed ? (
              <div className="bg-white border-4 border-[#FFCC00] rounded-3xl p-5 shadow-[0_0_40px_rgba(255,204,0,0.6)] space-y-3 text-blue-950">
                <span className="text-2xl font-black uppercase font-cinzel block text-amber-600">
                  ¡GANASTE EL TURNO!
                </span>

                {/* Temporizador de 10 segundos */}
                {bState.playerAnswer || hasSubmitted ? (
                  <div className="p-2.5 rounded-xl bg-emerald-100 border border-emerald-400 text-emerald-800 text-xs font-bold">
                    ✓ Respuesta enviada a tiempo al proyector.
                  </div>
                ) : (
                  <div className="p-2.5 rounded-xl bg-amber-50 border-2 border-amber-300">
                    <div className="flex items-center justify-between text-xs font-black text-amber-900 mb-1">
                      <span>Tiempo para escribir:</span>
                      <span className="font-mono text-sm font-black px-2 py-0.5 rounded bg-amber-500 text-white">
                        {bState.answerTimeRemaining ?? 10}s
                      </span>
                    </div>
                    <div className="w-full bg-amber-200 h-2 rounded-full overflow-hidden">
                      <div
                        className="h-full bg-amber-600 transition-all duration-1000 ease-linear rounded-full"
                        style={{ width: `${((bState.answerTimeRemaining ?? 10) / 10) * 100}%` }}
                      />
                    </div>
                  </div>
                )}

                <form onSubmit={handleSubmitAnswer} className="space-y-3">
                  <input
                    type="text"
                    autoFocus
                    value={answerInput}
                    onChange={(e) => setAnswerInput(e.target.value)}
                    placeholder="Escribe tu respuesta aquí..."
                    className="w-full py-3 px-3 rounded-xl border-2 border-blue-950 font-bold text-sm text-blue-950 outline-none focus:border-amber-500"
                  />
                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-[#FFCC00] hover:bg-yellow-300 text-[#000533] font-black text-xs uppercase tracking-wider shadow cursor-pointer"
                  >
                    {hasSubmitted ? 'Actualizar Respuesta' : 'Enviar Respuesta (10s)'}
                  </button>
                </form>
              </div>
            ) : (
              <div>
                <button
                  onClick={handlePressBuzz}
                  disabled={!isBuzzerOpen || isLocked}
                  className={`w-60 h-60 mx-auto rounded-full border-8 font-cinzel font-black text-3xl uppercase tracking-widest shadow-2xl transition-all flex flex-col items-center justify-center cursor-pointer select-none active:scale-95 ${
                    isLocked
                      ? 'bg-slate-800 border-slate-600 text-slate-500 cursor-not-allowed'
                      : isBuzzerOpen
                      ? 'bg-rose-600 hover:bg-rose-500 border-yellow-400 text-white shadow-[0_0_60px_rgba(225,29,72,0.8)] animate-pulse'
                      : 'bg-blue-950 border-blue-800 text-blue-400/50 cursor-not-allowed'
                  }`}
                >
                  <span>{isLocked ? 'BLOQUEADO' : isBuzzerOpen ? '¡PULSAR!' : 'EN ESPERA'}</span>
                  <span className="text-[11px] font-sans font-bold tracking-normal opacity-80 mt-1">
                    {isLocked ? 'Ya respondiste' : isBuzzerOpen ? '¡Toca rápido!' : 'Pistas en lectura'}
                  </span>
                </button>
              </div>
            )}
          </div>

          <div className="text-center">
            <button
              onClick={onSwitchToHost}
              className="text-xs text-blue-400 hover:text-white underline"
            >
              Cambiar a Modo Anfitrión
            </button>
          </div>
        </div>
      );
    }

    // --- SIMULADOR RÁPIDO DE PULSADORES (Flotante) ---
    function QuickBuzzerSimulator({ gameState, onStateChange, onClose }) {
      const bState = gameState.buzzerState;
      const isBuzzerOpen = bState.isOpen;

      const simulateBuzz = (teamId, teamName) => {
        if (!isBuzzerOpen || (bState.lockedTeams || []).includes(teamId)) return;
        soundManager.playBuzz();

        const updatedBState = {
          ...bState,
          isOpen: false,
          buzzedTeamId: teamId,
          buzzedPlayerName: `${teamName} (Pulsador)`,
          buzzedAt: Date.now(),
          answerTimeLimit: 10,
          answerTimeRemaining: 10,
          playerAnswer: null
        };

        const nextActive = gameState.activeClue ? { ...gameState.activeClue, state: 'buzzed' } : null;

        onStateChange({
          ...gameState,
          activeClue: nextActive,
          buzzerState: updatedBState
        });
      };

      return (
        <div className="fixed bottom-4 right-4 z-40 bg-[#000842] border-2 border-[#FFCC00] rounded-2xl p-3.5 shadow-2xl w-72 space-y-2.5 animate-in slide-in-from-bottom-5">
          <div className="flex items-center justify-between border-b border-blue-900 pb-2">
            <span className="text-xs font-black uppercase text-[#FFCC00]">
              Simulador de Pulsadores
            </span>
            <button onClick={onClose} className="text-blue-300 hover:text-white text-xs font-bold">
              ✕
            </button>
          </div>
          <p className="text-[11px] text-blue-200">
            {isBuzzerOpen ? 'Pulsadores habilitados. Haz clic en un equipo para pulsar:' : 'Habilita primero los pulsadores en la pista.'}
          </p>
          <div className="grid grid-cols-1 gap-1.5">
            {gameState.teams.map((t) => {
              const isLocked = (bState.lockedTeams || []).includes(t.id);
              return (
                <button
                  key={t.id}
                  disabled={!isBuzzerOpen || isLocked}
                  onClick={() => simulateBuzz(t.id, t.name)}
                  className={`py-2 px-3 rounded-xl font-black text-xs uppercase flex items-center justify-between border transition-all ${
                    isLocked
                      ? 'bg-slate-800 text-slate-500 border-slate-700 opacity-60 cursor-not-allowed'
                      : isBuzzerOpen
                      ? 'text-white hover:brightness-110 active:scale-98 cursor-pointer shadow'
                      : 'bg-blue-950 text-blue-400 border-blue-900 opacity-60 cursor-not-allowed'
                  }`}
                  style={{ backgroundColor: isBuzzerOpen && !isLocked ? t.color : undefined }}
                >
                  <span>{t.name}</span>
                  <span className="text-[10px] font-mono font-bold">
                    {isLocked ? 'BLOQUEADO' : 'PULSAR'}
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // Montar la aplicación
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
